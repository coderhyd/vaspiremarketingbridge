<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaspire Remote Control</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2a;--line:#29455c;--text:#eef6fb;--muted:#91a7bb;--accent:#13b8a6;--playing:#173f36}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101c,#0c1d2c);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--accent)}.status{padding:9px;border-radius:8px;background:#071522;color:var(--muted);margin:10px 0}.ok{color:#61e4ca}.bad{color:#ff9a96}.session{font-size:12px;color:var(--muted)}.search{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#071522;color:#fff;margin:8px 0}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.item.playing{background:var(--playing);border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}.name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-block;background:var(--accent);color:#031511;border-radius:5px;padding:3px 6px;font-size:10px;font-weight:900;margin-left:6px}button{border:0;border-radius:8px;padding:11px 15px;background:var(--accent);color:#031511;font-weight:900;cursor:pointer}button.secondary{background:#213a50;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.empty{text-align:center;color:var(--muted);padding:25px}.danger{background:#ef5350;color:#fff}@media(max-width:600px){.wrap{padding:10px}.item{grid-template-columns:1fr}.item button{width:100%}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Vaspire <span>Remote</span></div><button id="refresh" class="secondary">Refresh</button></div>
  <div id="status" class="status">Connecting…</div>
  <div class="panel"><div id="meetingTitle" class="brand" style="font-size:18px">No session</div><div id="sessionInfo" class="session"></div></div>
  <div class="panel">
    <input id="search" class="search" type="search" placeholder="Search name, company, seat or slide…">
    <div id="list"><div class="empty">Loading presentations…</div></div>
  </div>
</div>
<script>
(function(){'use strict';
var SUPABASE_URL='https://zhufcryqamaubxjorjgm.supabase.co';
var SUPABASE_KEY='sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN';
var db=null, meeting=null, rows=[], channel=null;
var params=new URLSearchParams(location.search), meetingId=params.get('meeting'), session=params.get('session');
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function type(name){return /\.(mp4|webm|ogg|mov|m4v)$/i.test(name)?'video':'image'}
function setStatus(t,good){$('status').textContent=t;$('status').className='status '+(good===true?'ok':good===false?'bad':'')}
async function start(){
 if(!meetingId||!session){setStatus('Invalid remote session link.',false);return}
 if(!window.supabase){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=connect;s.onerror=function(){setStatus('Could not load Supabase.',false)};document.head.appendChild(s)}else connect();
}
async function connect(){
 try{
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  var r=await db.from('meetings').select('*').eq('id',meetingId).eq('code',session).single();
  if(r.error)throw r.error;
  meeting=r.data;
  $('meetingTitle').textContent=meeting.title||'Meeting';
  $('sessionInfo').textContent='Session: '+session.slice(0,8)+'…'+(meeting.active?' · ACTIVE':' · INACTIVE');
  if(!meeting.active){setStatus('This meeting session is not active.',false)}else setStatus('Remote connected. Ready to play.',true);
  await load(); subscribe();
 }catch(e){console.error(e);setStatus('Session not found or access denied: '+(e.message||e),false)}
}
async function load(){
 var r=await db.from('guests').select('*,presentations(*)').eq('meeting_id',meeting.id);
 if(r.error){setStatus(r.error.message,false);return}
 rows=(r.data||[]).map(function(g){var ps=(g.presentations||[]).sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at)});return {g:g,p:ps[0]}}).filter(function(x){return x.p});
 render();
}
function render(){
 var q=($('search').value||'').trim().toLowerCase();var list=rows.filter(function(x){var g=x.g,p=x.p;return !q||[g.name,g.company_name,g.mobile_number,g.mobile,g.phone,g.phone_number,g.member_type,g.seat_number,p.file_name].join(' ').toLowerCase().indexOf(q)>=0});
 $('list').innerHTML=list.map(function(x){var g=x.g,p=x.p,playing=p.status==='playing';return '<div class="item '+(playing?'playing':'')+'"><div><div class="name">'+esc(g.member_type==='Paid Member'?('Seat '+g.seat_number+' · '):'')+esc(g.name)+(playing?'<span class="badge">NOW PLAYING</span>':'')+'</div><div class="meta">'+esc(g.company_name||'')+' · '+esc(p.file_name)+'</div></div><button data-play="'+esc(p.id)+'" '+(!meeting.active?'disabled':'')+'>'+ (playing?'▶ PLAYING':'▶ PLAY')+'</button></div>'}).join('')||'<div class="empty">No presentations found.</div>';
 Array.prototype.forEach.call(document.querySelectorAll('[data-play]'),function(b){b.onclick=function(){play(b.getAttribute('data-play'))}})
}
async function play(id){
 if(!meeting||!meeting.active)return;
 var reset=await db.from('presentations').update({status:'ready'}).eq('meeting_id',meeting.id).eq('status','playing');
 if(reset.error){alert(reset.error.message);return}
 var r=await db.from('presentations').update({status:'playing',played_at:new Date().toISOString()}).eq('id',id).eq('meeting_id',meeting.id);
 if(r.error){alert(r.error.message);return}
 await load();
}
function subscribe(){
 if(channel)db.removeChannel(channel);
 channel=db.channel('remote-'+meeting.id).on('postgres_changes',{event:'*',schema:'public',table:'presentations',filter:'meeting_id=eq.'+meeting.id},function(){load()}).subscribe();
}
$('refresh').onclick=load;$('search').oninput=render;start();
})();
</script>
</body>
</html>
