<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Vaspire Remote Control</title>
<style>
:root{--bg:#050b14;--panel:#0c1726;--panel2:#101f31;--line:#20364d;--text:#f4f8fb;--muted:#8ea3b7;--accent:#16c5ae;--accent2:#0c8f80;--playing:#103d36;--playingLine:#20d5ba;--danger:#f05252;--shadow:0 14px 40px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#10243a 0,#07111f 38%,#040911 100%);color:var(--text);font-family:Inter,Arial,sans-serif}button,input{font:inherit}.app{max-width:900px;margin:auto;padding:14px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-size:22px;font-weight:900;letter-spacing:-.4px}.brand span{color:var(--accent)}.topActions{display:flex;gap:7px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer;background:var(--accent);color:#031713}button.secondary{background:#172b40;color:#eaf4f8;border:1px solid #29445d}button:disabled{opacity:.45;cursor:not-allowed}.connection{display:flex;align-items:center;gap:8px;background:rgba(12,23,38,.9);border:1px solid var(--line);padding:9px 12px;border-radius:12px;color:var(--muted);font-size:12px;margin-bottom:12px}.dot{width:9px;height:9px;border-radius:50%;background:#66798a}.dot.ok{background:var(--accent);box-shadow:0 0 12px rgba(22,197,174,.65)}.dot.bad{background:var(--danger)}.sessionCard{background:linear-gradient(145deg,#102237,#0b1726);border:1px solid #29445d;border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:13px}.sessionLabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800}.meetingTitle{font-size:24px;font-weight:900;margin-top:4px}.sessionMeta{color:var(--muted);font-size:12px;margin-top:7px}.current{background:linear-gradient(135deg,#104238,#0d302b);border:1px solid var(--playingLine);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 0 0 1px rgba(32,213,186,.06),var(--shadow)}.currentTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7be6d5;font-weight:900}.liveBadge{font-size:10px;font-weight:900;background:var(--playingLine);color:#031713;padding:5px 8px;border-radius:7px}.currentName{font-size:21px;font-weight:900;margin-top:7px}.currentMeta{font-size:12px;color:#acd9d2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.controls button{padding:12px}.stop{background:#172b40!important;color:#fff!important;border:1px solid #29445d!important}.searchWrap{position:sticky;top:0;z-index:5;padding:4px 0 10px;background:linear-gradient(#07111f 70%,rgba(7,17,31,0));}.search{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:#0b1726;color:#fff;outline:none}.search:focus{border-color:var(--accent)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 8px}.sectionTitle h2{font-size:14px;margin:0}.count{font-size:11px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:8px}.item{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:15px;background:rgba(12,23,38,.92);transition:.15s}.item.playing{background:linear-gradient(135deg,#123f37,#0d302b);border-color:var(--playingLine);box-shadow:inset 4px 0 0 var(--playingLine)}.seat{width:48px;height:48px;border-radius:12px;background:#172b40;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#d9e9f2}.item.playing .seat{background:#155b4f;color:#bffff3}.info{min-width:0}.name{font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.company{font-size:12px;color:#a6b8c8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playingText{display:inline-block;margin-left:7px;font-size:9px;vertical-align:2px;padding:3px 5px;border-radius:5px;background:var(--playingLine);color:#031713;font-weight:950}.playBtn{min-width:83px}.item.playing .playBtn{background:#20d5ba;color:#031713}.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed #2b4359;border-radius:15px}.footerNote{text-align:center;color:#62778b;font-size:10px;margin-top:18px}.offline{background:#35181a!important;border-color:#6c2a2c!important;color:#ffb2b2!important}@media(max-width:600px){.app{padding:10px 10px 70px}.brand{font-size:19px}.topActions button{padding:9px 10px}.sessionCard{padding:14px}.meetingTitle{font-size:21px}.currentName{font-size:19px}.item{grid-template-columns:48px minmax(0,1fr);gap:9px}.seat{width:44px;height:44px}.playBtn{grid-column:1/-1;width:100%;padding:12px}.controls{grid-template-columns:1fr}.searchWrap{padding-top:2px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Vaspire <span>Remote</span></div>
    <div class="topActions"><button id="refresh" class="secondary">↻ Refresh</button></div>
  </div>

  <div id="connection" class="connection"><span id="dot" class="dot"></span><span id="connectionText">Connecting to session…</span></div>

  <section class="sessionCard">
    <div class="sessionLabel">Remote Session</div>
    <div id="meetingTitle" class="meetingTitle">Loading meeting…</div>
    <div id="sessionMeta" class="sessionMeta">Checking session…</div>
  </section>

  <section id="current" class="current" style="display:none">
    <div class="currentTop"><div class="eyebrow">Currently Presenting</div><div class="liveBadge">● LIVE</div></div>
    <div id="currentName" class="currentName"></div>
    <div id="currentMeta" class="currentMeta"></div>
    <div class="controls">
      <button id="replayCurrent">▶ Present Again</button>
      <button id="stopCurrent" class="stop">■ Stop Presentation</button>
    </div>
  </section>

  <div class="searchWrap"><input id="search" class="search" type="search" placeholder="Search member, company, seat or presentation…"></div>

  <div class="sectionTitle"><h2>Presentations</h2><span id="count" class="count">0</span></div>
  <div id="list" class="list"><div class="empty">Loading presentations…</div></div>
  <div class="footerNote">Session-based remote control · Changes sync automatically</div>
</div>

<script>
(function(){'use strict';
var SUPABASE_URL='https://zhufcryqamaubxjorjgm.supabase.co';
var SUPABASE_KEY='sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN';
var db=null,meeting=null,rows=[],playing=null,channel=null,busy=false;
var params=new URLSearchParams(location.search),meetingId=params.get('meeting'),session=params.get('session');
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function mediaType(n){return /\.(mp4|webm|ogg|mov|m4v)$/i.test(n||'')?'video':'image'}
function setConnection(text,state){$('connectionText').textContent=text;$('dot').className='dot '+(state||'')}
function setMeeting(){
 $('meetingTitle').textContent=meeting.title||'Meeting';
 $('sessionMeta').textContent='Session connected · '+(meeting.active?'ACTIVE':'INACTIVE')+' · '+(meeting.meeting_date||'No date');
}
async function loadScript(){
 if(window.supabase)return connect();
 var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=connect;s.onerror=function(){setConnection('Unable to load remote service','bad')};document.head.appendChild(s);
}
async function connect(){
 try{
  if(!meetingId||!session)throw new Error('Invalid session link');
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  var r=await db.from('meetings').select('*').eq('id',meetingId).eq('code',session).single();
  if(r.error)throw r.error;
  meeting=r.data;setMeeting();
  setConnection(meeting.active?'Connected · Ready to control':'Session connected · Meeting is inactive',meeting.active?'ok':'bad');
  await load();subscribe();
 }catch(e){console.error(e);setConnection('Session unavailable','bad');$('meetingTitle').textContent='Invalid or expired session';$('sessionMeta').textContent=e.message||'Access denied';}
}
async function load(){
 if(!db||!meeting)return;
 var r=await db.from('guests').select('*,presentations(*)').eq('meeting_id',meeting.id);
 if(r.error){setConnection('Could not load presentations','bad');return}
 rows=[];
 (r.data||[]).forEach(function(g){
   (g.presentations||[]).forEach(function(p){rows.push({g:g,p:p})});
 });
 rows.sort(function(a,b){var ap=a.g.member_type==='Paid Member',bp=b.g.member_type==='Paid Member';if(ap!==bp)return ap?-1:1;if(ap)return (Number(a.g.seat_number)||999999)-(Number(b.g.seat_number)||999999);return String(a.g.name||'').localeCompare(String(b.g.name||''))});
 playing=rows.find(function(x){return x.p.status==='playing'})||null;
 render();renderCurrent();
}
function renderCurrent(){
 var box=$('current');
 if(!playing){box.style.display='none';return}
 box.style.display='block';
 var g=playing.g,p=playing.p;
 $('currentName').textContent=(g.member_type==='Paid Member'&&g.seat_number?'Seat '+g.seat_number+' · ':'')+(g.name||'Unnamed');
 $('currentMeta').textContent=[g.company_name,p.file_name].filter(Boolean).join(' · ');
 $('replayCurrent').disabled=!meeting.active||busy;$('stopCurrent').disabled=!meeting.active||busy;
}
function render(){
 var q=($('search').value||'').trim().toLowerCase();
 var filtered=rows.filter(function(x){var g=x.g,p=x.p;return !q||[g.name,g.company_name,g.mobile_number,g.mobile,g.phone,g.phone_number,g.member_type,g.seat_number,p.file_name].join(' ').toLowerCase().indexOf(q)>=0});
 $('count').textContent=filtered.length+(q?' / '+rows.length:'');
 $('list').innerHTML=filtered.map(function(x){
   var g=x.g,p=x.p,isPlaying=p.status==='playing';
   var seat=g.member_type==='Paid Member'&&g.seat_number?esc(g.seat_number):'—';
   return '<div class="item '+(isPlaying?'playing':'')+'">'
     +'<div class="seat">'+seat+'</div>'
     +'<div class="info"><div class="name">'+esc(g.name||'Unnamed')+(isPlaying?'<span class="playingText">NOW PLAYING</span>':'')+'</div>'
     +'<div class="company">'+esc(g.company_name||g.member_type||'')+'</div>'
     +'<div class="file">'+esc(p.file_name||'Presentation')+' · '+mediaType(p.file_name).toUpperCase()+'</div></div>'
     +'<button class="playBtn" data-play="'+esc(p.id)+'" '+(!meeting.active||busy?'disabled':'')+'>'+(isPlaying?'▶ PLAYING':'▶ PLAY')+'</button>'
     +'</div>';
 }).join('')||'<div class="empty">No presentations found.</div>';
 Array.prototype.forEach.call(document.querySelectorAll('[data-play]'),function(b){b.onclick=function(){play(b.getAttribute('data-play'))}});
}
async function play(id){
 if(!meeting||!meeting.active||busy)return;
 busy=true;render();renderCurrent();
 try{
   // Make exactly one presentation the active one for this session.
   var reset=await db.from('presentations').update({status:'ready'}).eq('meeting_id',meeting.id).eq('status','playing');
   if(reset.error)throw reset.error;
   var r=await db.from('presentations').update({status:'playing',played_at:new Date().toISOString()}).eq('id',id).eq('meeting_id',meeting.id);
   if(r.error)throw r.error;
   await load();
 }catch(e){alert('Could not start presentation.\n\n'+(e.message||e));await load()}
 finally{busy=false;render();renderCurrent()}
}
async function stop(){
 if(!meeting||!meeting.active||busy)return;
 busy=true;render();
 try{var r=await db.from('presentations').update({status:'ready'}).eq('meeting_id',meeting.id).eq('status','playing');if(r.error)throw r.error;await load()}
 catch(e){alert('Could not stop presentation.\n\n'+(e.message||e));await load()}
 finally{busy=false;render();renderCurrent()}
}
function subscribe(){
 if(channel)db.removeChannel(channel);
 channel=db.channel('remote-session-'+meeting.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'presentations',filter:'meeting_id=eq.'+meeting.id},function(){load()})
  .subscribe(function(status){if(status==='SUBSCRIBED')setConnection(meeting.active?'Connected · Live sync ON':'Session connected · Meeting inactive',meeting.active?'ok':'bad')});
}
$('refresh').onclick=function(){load()};$('search').oninput=render;$('stopCurrent').onclick=stop;$('replayCurrent').onclick=function(){if(playing)play(playing.p.id)};
loadScript();
})();
</script>
</body>
</html>
