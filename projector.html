<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaspire Projector Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--b:#07111f;--p:#0d1b2a;--p2:#12263a;--t:#eef5fb;--m:#91a7bb;--a:#13b8a6;--d:#ef5350;--l:#244056}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101c,#0c1d2c);color:var(--t);font:14px Arial}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--a)}button{border:0;border-radius:8px;padding:10px 13px;background:var(--a);font-weight:700;cursor:pointer}button.s{background:#20374b;color:white}button.d{background:var(--d);color:white}.grid{display:grid;grid-template-columns:340px 1fr;gap:15px;margin-top:15px}.main{display:grid;grid-template-columns:1fr 420px;gap:15px}.panel{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:15px;margin-bottom:15px}.field{margin:8px 0}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--l);background:#071522;color:#fff}.row,.toolbar{display:flex;gap:7px;flex-wrap:wrap}.status{padding:9px;background:#071522;border-radius:8px;color:var(--m);margin:8px 0}.on{color:#59e3c9}.off{color:#ff8d8a}.meetings{max-height:180px;overflow:auto}.meeting{padding:9px;border:1px solid var(--l);border-radius:8px;margin:6px 0;cursor:pointer}.meeting.active{border-color:var(--a);background:#123042}.qr{background:#fff;padding:10px;width:max-content;margin:10px auto;border-radius:8px}.url{word-break:break-all;color:#9debe0;font-size:11px}.preview{height:440px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img,.preview video{max-width:100%;max-height:100%;object-fit:contain}.empty{color:#60778b;text-align:center}.list{max-height:380px;overflow:auto}.item{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--l)}.item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:11px;color:var(--m)}.guest{display:grid;grid-template-columns:60px 1.2fr 1.2fr 110px 1.2fr 210px;gap:7px;align-items:center;padding:9px;border-bottom:1px solid var(--l)}.head{color:var(--m);font-size:11px;font-weight:bold}.actions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:1100px){.grid,.main{grid-template-columns:1fr}.guest{grid-template-columns:50px 1fr 1fr}.preview{height:330px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">Vaspire <span>Projector Control</span></div><div class="row"><button class="s" id="openScreen">Open Screen 2</button><button class="s" id="full">Fullscreen</button></div></div>
<div class="grid"><aside>
<div class="panel"><h3>Meeting Manager</h3><div class="field"><label>Meeting Name</label><input id="mn" placeholder="RBG Platinum Meet"></div><div class="field"><label>Date</label><input id="md" type="date"></div><label><input id="ge" type="checkbox" checked> Guest uploads enabled</label><br><br><button id="create">Create Meeting</button><div id="ms" class="status">No meeting selected.</div><h3>Meetings</h3><div id="ml" class="meetings"></div></div>
<div class="panel"><h3>Guest Upload QR</h3><div id="us" class="status">Select a meeting.</div><div id="qr" class="qr"></div><div id="url" class="url"></div><br><div class="row"><button class="s" id="copy">Copy Link</button><button class="s" id="toggle">Disable Uploads</button></div></div>
</aside><main>
<div class="main"><div class="panel"><h3>Live / Preview</h3><div class="toolbar"><button class="s" id="stop">■ Stop Live</button><button class="s" id="clear">Clear</button></div><div id="preview" class="preview"><div class="empty">No slide selected</div></div></div>
<div class="panel"><h3>Operator Media</h3><input id="files" type="file" multiple accept="image/*,video/*"><br><br><button id="add">Upload Selected Media</button><div id="media" class="list"></div><hr style="border-color:#244056"><h3>Manual Name Slide</h3><div class="field"><label>Name</label><input id="nn"></div><div class="field"><label>Company / Designation</label><input id="nc"></div><button id="nameadd">Add Name Slide</button></div></div>
<div class="panel"><h3>Guest Presentations <span class="small" id="gc"></span></h3><div class="guest head"><div>Seat</div><div>Name</div><div>Company</div><div>Type</div><div>Slide</div><div>Operator</div></div><div id="guests" class="list"></div></div>
<div class="panel"><h3>Local Playlist / Project Folder</h3><div class="toolbar"><input id="folder" type="file" webkitdirectory directory multiple><button class="s" id="load">Load Project Folder</button><button class="s" id="prev">Previous</button><button class="s" id="next">Next</button><button class="s" id="loop">Auto Loop: OFF</button></div><div id="playlist" class="list"></div></div>
</main></div></div>
<script>
const URL='https://zhufcryqamaubxjorjgm.supabase.co',KEY='sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN',db=supabase.createClient(URL,KEY);const $=x=>document.getElementById(x);let meeting=null,screen2=null,ch=null,guestRows=[],mediaRows=[],playlist=[],pi=0,loop=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const type=n=>/\.(mp4|webm|ogg)$/i.test(n)?'video':'image';
async function meetings(){let r=await db.from('meetings').select('*').order('meeting_date',{ascending:false});if(r.error)return $('ms').textContent=r.error.message;$('ml').innerHTML=(r.data||[]).map(x=>`<div class="meeting ${meeting?.id===x.id?'active':''}" onclick="selectMeeting('${x.id}')"><b>${esc(x.name)}</b><div class=small>${esc(x.meeting_date||'')} · ${x.guest_upload_enabled?'Uploads ON':'Uploads OFF'}</div></div>`).join('')||'<div class=small>No meetings.</div>'}
window.selectMeeting=async id=>{let r=await db.from('meetings').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);meeting=r.data;$('ms').innerHTML=`<b>${esc(meeting.name)}</b><br>${esc(meeting.meeting_date||'')} · <span class="${meeting.guest_upload_enabled?'on':'off'}">${meeting.guest_upload_enabled?'UPLOADS ENABLED':'UPLOADS DISABLED'}</span>`;$('ge').checked=meeting.guest_upload_enabled;link();await loadGuests();await loadMedia();subscribe();meetings()};
function link(){if(!meeting){$('qr').innerHTML='';return}let base=location.href.split('?')[0].replace(/projector\.html$/,'guest.html'),u=`${base}?meeting=${meeting.id}`;$('url').textContent=u;$('qr').innerHTML='';new QRCode($('qr'),{text:u,width:190,height:190});$('us').innerHTML=meeting.guest_upload_enabled?'<span class=on>● ENABLED</span>':'<span class=off>● DISABLED</span>';$('toggle').textContent=meeting.guest_upload_enabled?'Disable Uploads':'Enable Uploads'}
$('create').onclick=async()=>{let name=$('mn').value.trim();if(!name)return alert('Enter meeting name');let r=await db.from('meetings').insert({name,meeting_date:$('md').value||null,guest_upload_enabled:$('ge').checked}).select().single();if(r.error)return alert(r.error.message);selectMeeting(r.data.id)};
$('toggle').onclick=async()=>{if(!meeting)return;let v=!meeting.guest_upload_enabled,r=await db.from('meetings').update({guest_upload_enabled:v}).eq('id',meeting.id);if(r.error)return alert(r.error.message);meeting.guest_upload_enabled=v;link();meetings()};
$('copy').onclick=()=>navigator.clipboard?.writeText($('url').textContent);
async function loadGuests(){let r=await db.from('guests').select('*,presentations(*)').eq('meeting_id',meeting.id);if(r.error)return $('guests').innerHTML=`<div class=empty>${esc(r.error.message)}</div>`;guestRows=(r.data||[]).sort((a,b)=>{let ap=a.member_type==='Paid Member',bp=b.member_type==='Paid Member';if(ap!==bp)return ap?-1:1;if(ap)return (+a.seat_number||999999)-(+b.seat_number||999999);return (a.name||'').localeCompare(b.name||'')});$('gc').textContent=`(${guestRows.length})`;$('guests').innerHTML=guestRows.map(g=>{let p=(g.presentations||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];return `<div class=guest><b>${g.member_type==='Paid Member'?esc(g.seat_number):'—'}</b><div>${esc(g.name)}</div><div>${esc(g.company_name)}</div><div><span class=small>${esc(g.member_type)}</span></div><div class=small>${p?esc(p.file_name):'No slide'}</div><div class=actions>${p?`<button class=s onclick="preview('${p.id}')">Preview</button><button onclick="play('${p.id}')">▶ PLAY</button>`:''}</div></div>`}).join('')||'<div class=empty style="padding:30px">No guest slides.</div>'}
window.preview=async id=>{let r=await db.from('presentations').select('*').eq('id',id).single();if(!r.error)show(r.data.file_url,type(r.data.file_name),r.data.file_name)};
window.play=async id=>{let r=await db.from('presentations').update({status:'playing',played_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message)};
function show(url,t,title){$('preview').innerHTML=t==='video'?`<video src="${url}" controls autoplay></video>`:`<img src="${url}" alt="${esc(title)}">`;if(screen2&&!screen2.closed)screen2.postMessage({type:'PLAY',url,mediaType:t},'*')}
function subscribe(){if(ch)db.removeChannel(ch);ch=db.channel('meeting-'+meeting.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'presentations',filter:`meeting_id=eq.${meeting.id}`},p=>{if(p.new.status==='playing')show(p.new.file_url,type(p.new.file_name),p.new.file_name);loadGuests()}).subscribe()}
$('openScreen').onclick=()=>{
  if(screen2&&!screen2.closed){screen2.focus();return}
  screen2=window.open('','vaspireScreen','width=1280,height=720,left=1200,top=0');
  if(!screen2){alert('Allow pop-ups for this website, then click Open Screen 2 again.');return}
  screen2.document.open();
  screen2.document.write('<!doctype html><html><head><title>Vaspire Projector Screen</title></head><body style="margin:0;background:#000;width:100vw;height:100vh;overflow:hidden"><div id="v" style="height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font:24px Arial">Vaspire Projector — Waiting</div></body></html>');
  screen2.document.close();
  screen2.addEventListener('message',function(e){
    var v=screen2.document.getElementById('v');
    if(!v)return;
    if(e.data && e.data.type==='CLEAR'){
      v.innerHTML='Vaspire Projector — Waiting';
      return;
    }
    if(e.data && e.data.type==='PLAY'){
      if(e.data.mediaType==='video'){
        v.innerHTML='';
        var video=screen2.document.createElement('video');
        video.src=e.data.url; video.autoplay=true; video.controls=true;
        video.style.maxWidth='100%'; video.style.maxHeight='100%';
        v.appendChild(video);
      }else{
        v.innerHTML='';
        var img=screen2.document.createElement('img');
        img.src=e.data.url; img.style.maxWidth='100%'; img.style.maxHeight='100%'; img.style.objectFit='contain';
        v.appendChild(img);
      }
    }
  });
};
$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('stop').onclick=async()=>{if(meeting)await db.from('presentations').update({status:'ended'}).eq('meeting_id',meeting.id).eq('status','playing');if(screen2&&!screen2.closed)screen2.postMessage({type:'CLEAR'},'*');$('preview').innerHTML='<div class=empty>Stopped</div>'};$('clear').onclick=()=>$('preview').innerHTML='<div class=empty>No slide selected</div>';
async function loadMedia(){let r=await db.from('meeting_media').select('*').eq('meeting_id',meeting.id).order('sort_order').order('created_at');if(r.error)return $('media').innerHTML=`<div class=small>${esc(r.error.message)}</div>`;mediaRows=r.data||[];renderMedia()}
function renderMedia(){$('media').innerHTML=mediaRows.map(m=>`<div class=item><span class=name>${esc(m.file_name)}</span><span class=small>${m.media_type}</span><button class=s onclick="pm('${m.id}')">Preview</button><button onclick="playm('${m.id}')">Play</button><button class=d onclick="dm('${m.id}')">×</button></div>`).join('')||'<div class=small>No operator media.</div>'}
window.pm=id=>{let m=mediaRows.find(x=>x.id===id);if(m)show(m.file_url,m.media_type,m.file_name)};window.playm=window.pm;window.dm=async id=>{if(confirm('Delete media?')){await db.from('meeting_media').delete().eq('id',id);loadMedia()}};
$('add').onclick=async()=>{if(!meeting)return alert('Select meeting first');let fs=[...$('files').files];if(!fs.length)return alert('Choose image/video files');for(let f of fs){let path=`${meeting.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,u=await db.storage.from('meeting-media').upload(path,f);if(u.error){alert(u.error.message);continue}let pub=db.storage.from('meeting-media').getPublicUrl(path).data.publicUrl;await db.from('meeting_media').insert({meeting_id:meeting.id,file_name:f.name,file_url:pub,media_type:f.type.startsWith('video/')?'video':'image',sort_order:mediaRows.length})}$('files').value='';loadMedia()};
$('nameadd').onclick=()=>{let n=$('nn').value.trim(),c=$('nc').value.trim();if(!n)return alert('Enter name');let w=window.open('','nameSlide','width=1280,height=720');if(!w)return alert('Allow pop-ups');w.document.write(`<body style="margin:0;background:#07111f;color:#fff;display:flex;align-items:center;justify-content:center;font:Arial"><div style="text-align:center"><div style="font-size:60px;font-weight:800">${esc(n)}</div><div style="font-size:28px;color:#13b8a6">${esc(c)}</div></div></body>`);w.document.close()};
$('load').onclick=()=>{let fs=[...$('folder').files];if(!fs.length)return alert('Choose a project folder');playlist=fs;renderPlaylist()};function renderPlaylist(){$('playlist').innerHTML=playlist.map((f,i)=>`<div class=item><span class=name>${i+1}. ${esc(f.name)}</span><button onclick="localPlay(${i})">Play</button></div>`).join('')};window.localPlay=i=>{let f=playlist[i];if(f)show(URL.createObjectURL(f),f.type.startsWith('video/')?'video':'image',f.name);pi=i};$('next').onclick=()=>{if(playlist.length)localPlay((pi+1)%playlist.length)};$('prev').onclick=()=>{if(playlist.length)localPlay((pi-1+playlist.length)%playlist.length)};$('loop').onclick=()=>{loop=!loop;$('loop').textContent='Auto Loop: '+(loop?'ON':'OFF')};
meetings();
</script></body></html>
