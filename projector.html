<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">

  <title>Vaspire Guest Slide Upload</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #10283d 0%, transparent 40%),
        #07111f;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px 14px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 30px;
      background: #0d1b2a;
      border: 1px solid #244056;
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(0,0,0,.3);
    }

    .brand {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .brand span {
      color: #13b8a6;
    }

    .subtitle {
      color: #91a7bb;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .meeting-info {
      padding: 16px 18px;
      background: #071522;
      border-radius: 12px;
      color: #a8bdd0;
      margin-bottom: 24px;
      font-size: 17px;
      font-weight: 600;
    }

    .f {
      margin: 17px 0;
    }

    .f label {
      display: block;
      color: #a8bdd0;
      font-size: 16px;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .required {
      color: #13b8a6;
    }

    .f input,
    .f select {
      width: 100%;
      padding: 16px;
      background: #071522;
      border: 1px solid #294963;
      border-radius: 11px;
      color: #fff;
      outline: none;
      font-size: 17px;
    }

    .f input:focus,
    .f select:focus {
      border-color: #13b8a6;
      box-shadow: 0 0 0 2px rgba(19,184,166,.12);
    }

    .f input[type="file"] {
      padding: 12px;
      cursor: pointer;
    }

    .f input[type="file"]::file-selector-button {
      padding: 10px 15px;
      margin-right: 10px;
      border: 1px solid #8ca0b5;
      border-radius: 7px;
      background: #f0f4fa;
      color: #111;
      cursor: pointer;
      font-size: 15px;
    }

    .seat {
      display: none;
    }

    .seat.visible {
      display: block;
    }

    .hint {
      color: #718ba1;
      font-size: 13px;
      margin-top: 7px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 11px;
      background: #13b8a6;
      color: #03100e;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      transition: .15s;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 15px;
      background: #071522;
      border-radius: 11px;
      margin-top: 16px;
      color: #91a7bb;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: #57e0c8;
      border: 1px solid rgba(87,224,200,.18);
    }

    .error {
      color: #ff8b8b;
      border: 1px solid rgba(255,139,139,.18);
    }

    .loading {
      color: #f5d98b;
    }

    .closed {
      display: none;
    }

    .security-note {
      margin-top: 18px;
      color: #627b91;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 20px;
        border-radius: 15px;
      }

      .brand {
        font-size: 27px;
      }

      .subtitle {
        font-size: 14px;
      }

      .f input,
      .f select {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <div class="brand">
    Vaspire <span>Guest Slide Upload</span>
  </div>

  <div class="subtitle">
    Submit your presentation slide for the meeting.
  </div>

  <div id="meetingInfo" class="meeting-info">
    Loading meeting...
  </div>

  <div id="closed" class="status closed"></div>

  <form id="guestForm" novalidate>

    <!-- NAME -->
    <div class="f">
      <label for="name">
        Name <span class="required">*</span>
      </label>

      <input
        id="name"
        type="text"
        autocomplete="name"
        maxlength="120"
        placeholder="Enter your full name"
        required
      >
    </div>


    <!-- COMPANY -->
    <div class="f">
      <label for="company">
        Company Name <span class="required">*</span>
      </label>

      <input
        id="company"
        type="text"
        autocomplete="organization"
        maxlength="160"
        placeholder="Enter company name"
        required
      >
    </div>


    <!-- MEMBER TYPE -->
    <div class="f">
      <label for="memberType">
        Member Type <span class="required">*</span>
      </label>

      <select id="memberType" required>
        <option value="Paid Member">Paid Member</option>
        <option value="Visitor">Visitor</option>
      </select>
    </div>


    <!-- SEAT NUMBER -->
    <div class="f seat" id="seatBox">

      <label for="seatNumber">
        Seat Number <span class="required">*</span>
      </label>

      <input
        id="seatNumber"
        type="text"
        inputmode="numeric"
        pattern="[0-9]+"
        maxlength="10"
        placeholder="Enter seat number"
      >

      <div class="hint">
        Seat number is required for Paid Members when enabled for this meeting.
      </div>

    </div>


    <!-- SLIDE -->
    <div class="f">

      <label for="slideFile">
        Slide <span class="required">*</span>
      </label>

      <input
        id="slideFile"
        type="file"
        accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf"
        required
      >

      <div class="hint">
        Accepted: JPG, PNG, WEBP or PDF.
      </div>

    </div>


    <!-- UPLOAD -->
    <button id="uploadButton" type="submit">
      ↑ Upload My Slide
    </button>


    <!-- STATUS -->
    <div id="status" class="status">
      Ready.
    </div>

  </form>

  <div class="security-note">
    Your presentation will be submitted to the meeting operator for review.
  </div>

</div>


<script>
"use strict";


/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://zhufcryqamaubxjorjgm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN";


const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GET MEETING ID FROM URL
   Example:

   guest.html?meeting=UUID
   ========================================================= */

const params = new URLSearchParams(
  window.location.search
);

const meetingId = params.get("meeting");


/* =========================================================
   DOM
   ========================================================= */

const form =
  document.getElementById("guestForm");

const nameInput =
  document.getElementById("name");

const companyInput =
  document.getElementById("company");

const memberTypeInput =
  document.getElementById("memberType");

const seatBox =
  document.getElementById("seatBox");

const seatInput =
  document.getElementById("seatNumber");

const fileInput =
  document.getElementById("slideFile");

const uploadButton =
  document.getElementById("uploadButton");

const statusBox =
  document.getElementById("status");

const meetingInfo =
  document.getElementById("meetingInfo");

const closedBox =
  document.getElementById("closed");


let meetingSeatRequired = true;
let currentMeeting = null;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

  statusBox.textContent = message;

  statusBox.className =
    "status" +
    (type ? " " + type : "");
}


function showClosed(message) {

  form.style.display = "none";

  closedBox.style.display = "block";

  closedBox.className =
    "status error";

  closedBox.textContent = message;
}


/* =========================================================
   SEAT FIELD
   ========================================================= */

function updateSeatField() {

  const isPaid =
    memberTypeInput.value === "Paid Member";

  const showSeat =
    isPaid && meetingSeatRequired;

  if (showSeat) {

    seatBox.classList.add("visible");

    seatInput.required = true;

  } else {

    seatBox.classList.remove("visible");

    seatInput.required = false;

    seatInput.value = "";
  }
}


memberTypeInput.addEventListener(
  "change",
  updateSeatField
);


/* =========================================================
   FILE NAME
   ========================================================= */

function safeFileName(name) {

  const extMatch =
    name.match(/\.([a-zA-Z0-9]+)$/);

  const ext =
    extMatch
      ? "." + extMatch[1].toLowerCase()
      : "";

  const base =
    name
      .replace(/\.[^/.]+$/, "")
      .replace(/[^a-zA-Z0-9_-]/g, "_")
      .replace(/_+/g, "_")
      .slice(0, 100);

  return (base || "slide") + ext;
}


/* =========================================================
   VALIDATE
   ========================================================= */

function validateForm() {

  const name =
    nameInput.value.trim();

  const company =
    companyInput.value.trim();

  const memberType =
    memberTypeInput.value;

  const seat =
    seatInput.value.trim();

  const file =
    fileInput.files[0];


  if (!name) {

    alert("Please enter your name.");

    nameInput.focus();

    return false;
  }


  if (!company) {

    alert("Please enter your company name.");

    companyInput.focus();

    return false;
  }


  if (
    memberType === "Paid Member" &&
    meetingSeatRequired
  ) {

    if (!seat) {

      alert(
        "Seat Number is required for Paid Members."
      );

      seatInput.focus();

      return false;
    }


    if (!/^[0-9]+$/.test(seat)) {

      alert(
        "Seat Number must contain numbers only."
      );

      seatInput.focus();

      return false;
    }


    const seatNumber =
      Number(seat);

    if (
      !Number.isInteger(seatNumber) ||
      seatNumber < 1
    ) {

      alert(
        "Please enter a valid Seat Number."
      );

      seatInput.focus();

      return false;
    }
  }


  if (!file) {

    alert("Please select your slide.");

    fileInput.focus();

    return false;
  }


  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "application/pdf"
  ];


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const allowedExtensions = [
    "jpg",
    "jpeg",
    "png",
    "webp",
    "pdf"
  ];


  if (
    !allowedTypes.includes(file.type) &&
    !allowedExtensions.includes(extension)
  ) {

    alert(
      "Only JPG, PNG, WEBP or PDF files are allowed."
    );

    return false;
  }


  /* 50 MB limit */

  const maxSize =
    50 * 1024 * 1024;

  if (file.size > maxSize) {

    alert(
      "File is too large. Maximum size is 50 MB."
    );

    return false;
  }


  return true;
}


/* =========================================================
   LOAD MEETING
   ========================================================= */

async function loadMeeting() {

  if (!meetingId) {

    showClosed(
      "Invalid meeting link. Meeting ID is missing."
    );

    return;
  }


  try {

    setStatus(
      "Checking meeting..."
    );


    const result =
      await db
        .from("meetings")
        .select(
          "id,title,meeting_date,guest_upload_enabled,seat_required"
        )
        .eq("id", meetingId)
        .single();


    if (result.error) {

      console.error(
        "Meeting error:",
        result.error
      );

      showClosed(
        "Meeting not found or unavailable."
      );

      return;
    }


    if (!result.data) {

      showClosed(
        "Meeting not found."
      );

      return;
    }


    currentMeeting =
      result.data;


    if (
      !result.data.guest_upload_enabled
    ) {

      showClosed(
        "Guest uploads are currently closed for this meeting."
      );

      return;
    }


    meetingSeatRequired =
      result.data.seat_required !== false;


    updateSeatField();


    const title =
      result.data.title ||
      "Guest Presentation";


    const date =
      result.data.meeting_date;


    meetingInfo.textContent =
      title +
      (date ? " • " + date : "");


    setStatus(
      "Ready to upload your slide."
    );

  } catch (error) {

    console.error(error);

    showClosed(
      "Unable to connect to the meeting service."
    );
  }
}


/* =========================================================
   RECHECK MEETING
   ========================================================= */

async function verifyMeeting() {

  const result =
    await db
      .from("meetings")
      .select(
        "id,guest_upload_enabled,seat_required"
      )
      .eq("id", meetingId)
      .single();


  if (
    result.error ||
    !result.data
  ) {

    throw new Error(
      "Meeting not found."
    );
  }


  if (
    !result.data.guest_upload_enabled
  ) {

    throw new Error(
      "Guest uploads have been disabled."
    );
  }


  meetingSeatRequired =
    result.data.seat_required !== false;


  updateSeatField();


  return result.data;
}


/* =========================================================
   UPLOAD
   ========================================================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    if (!validateForm()) {
      return;
    }


    uploadButton.disabled = true;

    uploadButton.textContent =
      "Uploading...";


    setStatus(
      "Checking meeting...",
      "loading"
    );


    const name =
      nameInput.value.trim();

    const company =
      companyInput.value.trim();

    const memberType =
      memberTypeInput.value;

    const seat =
      memberType === "Paid Member" &&
      meetingSeatRequired
        ? Number(seatInput.value.trim())
        : null;

    const file =
      fileInput.files[0];


    /*
     * IMPORTANT
     *
     * Generate UUID locally.
     *
     * We no longer use:
     *
     * .insert(...).select("id").single()
     *
     * because returning the inserted row can
     * invoke SELECT RLS.
     */

    const guestId =
      crypto.randomUUID();


    let storagePath = null;


    try {

      /* -------------------------------------------------------
         1. VERIFY MEETING
         ------------------------------------------------------- */

      await verifyMeeting();


      /* -------------------------------------------------------
         2. INSERT GUEST
         ------------------------------------------------------- */

      setStatus(
        "Registering guest...",
        "loading"
      );


      const guestInsert =
        await db
          .from("guests")
          .insert({

            id: guestId,

            meeting_id:
              meetingId,

            name:
              name,

            company_name:
              company,

            member_type:
              memberType,

            seat_number:
              seat

          });


      if (guestInsert.error) {

        console.error(
          "Guest insert error:",
          guestInsert.error
        );

        throw new Error(
          "Guest registration failed: " +
          guestInsert.error.message
        );
      }


      /* -------------------------------------------------------
         3. CREATE STORAGE PATH
         ------------------------------------------------------- */

      const filename =
        Date.now() +
        "-" +
        guestId +
        "-" +
        safeFileName(file.name);


      storagePath =
        meetingId +
        "/" +
        guestId +
        "/" +
        filename;


      /* -------------------------------------------------------
         4. UPLOAD SLIDE
         ------------------------------------------------------- */

      setStatus(
        "Uploading slide...",
        "loading"
      );


      const upload =
        await db
          .storage
          .from("guest-slides")
          .upload(
            storagePath,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                file.type ||
                "application/octet-stream"
            }
          );


      if (upload.error) {

        console.error(
          "Storage upload error:",
          upload.error
        );


        /*
         * Remove guest record because
         * storage upload failed.
         */

        await db
          .from("guests")
          .delete()
          .eq("id", guestId);


        throw new Error(
          "Slide upload failed: " +
          upload.error.message
        );
      }


      /* -------------------------------------------------------
         5. GET PUBLIC URL
         ------------------------------------------------------- */

      const publicUrlResult =
        db
          .storage
          .from("guest-slides")
          .getPublicUrl(
            storagePath
          );


      const fileUrl =
        publicUrlResult
          .data
          .publicUrl;


      /* -------------------------------------------------------
         6. CREATE PRESENTATION RECORD
         ------------------------------------------------------- */

      setStatus(
        "Saving presentation...",
        "loading"
      );


      const presentation =
        await db
          .from("presentations")
          .insert({

            meeting_id:
              meetingId,

            guest_id:
              guestId,

            file_name:
              file.name,

            file_url:
              fileUrl,

            status:
              "uploaded"

          });


      if (presentation.error) {

        console.error(
          "Presentation insert error:",
          presentation.error
        );


        /*
         * Clean up uploaded file.
         */

        await db
          .storage
          .from("guest-slides")
          .remove([
            storagePath
          ]);


        await db
          .from("guests")
          .delete()
          .eq("id", guestId);


        throw new Error(
          "Presentation record failed: " +
          presentation.error.message
        );
      }


      /* -------------------------------------------------------
         7. SUCCESS
         ------------------------------------------------------- */

      setStatus(
        "✓ Slide uploaded successfully. The meeting operator will review and play your presentation.",
        "success"
      );


      uploadButton.textContent =
        "✓ Slide Uploaded";


      nameInput.disabled = true;

      companyInput.disabled = true;

      memberTypeInput.disabled = true;

      seatInput.disabled = true;

      fileInput.disabled = true;

      uploadButton.disabled = true;


    } catch (error) {

      console.error(
        "UPLOAD ERROR:",
        error
      );


      setStatus(
        "Upload failed: " +
        (
          error.message ||
          "Unknown error"
        ),
        "error"
      );


      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "↑ Upload My Slide";
    }

  }
);


/* =========================================================
   START
   ========================================================= */

updateSeatField();

loadMeeting();

</script>

</body>
</html>
