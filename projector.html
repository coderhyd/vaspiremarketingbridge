<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaspire Projector Control</title>
<style>
:root{--bg:#06101c;--panel:#0d1b2a;--panel2:#102235;--line:#29455c;--text:#eef6fb;--muted:#91a7bb;--accent:#13b8a6;--danger:#ef5350}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101c,#0c1d2c);color:var(--text);font:14px Arial,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;font-weight:800}.brand span{color:var(--accent)}
.grid{display:grid;grid-template-columns:330px 1fr;gap:15px;margin-top:15px}.main{display:grid;grid-template-columns:1fr 390px;gap:15px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:15px}
h3{margin:3px 0 12px}.row,.toolbar{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:#031511;font-weight:800;cursor:pointer}button.secondary{background:#213a50;color:#fff}button.danger{background:var(--danger);color:#fff}
.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#071522;color:#fff}
.status{padding:9px;border-radius:8px;background:#071522;color:var(--muted);margin:9px 0}.ok{color:#61e4ca}.bad{color:#ff9a96}
.meetings,.list{max-height:380px;overflow:auto}.meeting{padding:9px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}.meeting.active{border-color:var(--accent);background:#123042}
.qr{background:#fff;padding:10px;width:max-content;margin:10px auto;border-radius:8px;min-height:20px}.url{font-size:11px;color:#9debe0;word-break:break-all}
.preview{height:440px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img,.preview video{max-width:100%;max-height:100%;object-fit:contain}.empty{color:#60778b;text-align:center}
.item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:11px;color:var(--muted)}
.guest{display:grid;grid-template-columns:55px 1fr 1fr 100px 1fr 170px;gap:7px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.guest.head{color:var(--muted);font-size:11px;font-weight:800}
.actions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:1050px){.grid,.main{grid-template-columns:1fr}.preview{height:330px}.guest{grid-template-columns:45px 1fr 1fr}.guest .optional{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Vaspire <span>Projector Control</span></div>
    <div class="row">
      <button id="openScreen" class="secondary">Open Screen 2</button>
      <button id="fullscreen" class="secondary">Fullscreen</button>
    </div>
  </div>

  <div id="appStatus" class="status">Starting control panel…</div>

  <div class="grid">
    <aside>
      <section class="panel">
        <h3>Meeting Manager</h3>
        <div class="field"><label>Meeting Name</label><input id="meetingName" placeholder="RBG Platinum Meet"></div>
        <div class="field"><label>Meeting Date</label><input id="meetingDate" type="date"></div>
        <label><input id="guestEnabled" type="checkbox" checked> Guest uploads enabled</label>
        <br><br><button id="createMeeting">Create Meeting</button>
        <div id="meetingStatus" class="status">No meeting selected.</div>
        <h3>Meetings</h3>
        <div id="meetingList" class="meetings"></div>
      </section>

      <section class="panel">
        <h3>Guest Upload QR</h3>
        <div id="uploadStatus" class="status">Select a meeting.</div>
        <div id="qr" class="qr"></div>
        <div id="guestUrl" class="url"></div>
        <div class="row">
          <button id="copyLink" class="secondary">Copy Link</button>
          <button id="toggleUploads" class="secondary">Disable Uploads</button>
        </div>
      </section>
    </aside>

    <main>
      <div class="main">
        <section class="panel">
          <h3>Live Preview</h3>
          <div class="toolbar">
            <button id="stopLive" class="secondary">■ Stop Live</button>
            <button id="clearPreview" class="secondary">Clear</button>
          </div>
          <div id="preview" class="preview"><div class="empty">No slide selected</div></div>
        </section>

        <section class="panel">
          <h3>Operator Media</h3>
          <input id="operatorFiles" type="file" multiple accept="image/*,video/*">
          <br><br>
          <button id="uploadOperatorMedia">Upload Selected Media</button>
          <div id="operatorMedia" class="list"></div>
          <hr style="border-color:#29455c">
          <h3>Manual Name Slide</h3>
          <div class="field"><label>Name</label><input id="nameSlideName"></div>
          <div class="field"><label>Company / Designation</label><input id="nameSlideCompany"></div>
          <button id="createNameSlide">Create Local Slide</button>
        </section>
      </div>

      <section class="panel">
        <h3>Guest Presentations <span id="guestCount" class="small"></span></h3>
        <div class="guest head"><div>Seat</div><div>Name</div><div>Company</div><div>Type</div><div>Slide</div><div>Operator</div></div>
        <div id="guestList" class="list"></div>
      </section>

      <section class="panel">
        <h3>Local Playlist / Project Folder</h3>
        <div class="toolbar">
          <input id="folderFiles" type="file" webkitdirectory directory multiple>
          <button id="loadFolder" class="secondary">Load Project Folder</button>
          <button id="previous" class="secondary">Previous</button>
          <button id="next" class="secondary">Next</button>
          <button id="autoLoop" class="secondary">Auto Loop: OFF</button>
        </div>
        <div id="playlist" class="list"></div>
      </section>
    </main>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================
   LOCAL PROJECTOR CORE
   This section never depends on Supabase.
   ========================= */
var screen2 = null;
var localPlaylist = [];
var playlistIndex = -1;
var autoLoop = false;
var meeting = null;
var mediaRows = [];

function $(id){ return document.getElementById(id); }

function setStatus(el, text, good){
  if(!el) return;
  el.textContent = text;
  el.className = 'status ' + (good === true ? 'ok' : good === false ? 'bad' : '');
}

function escapeHtml(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
  });
}

function mediaType(name){
  return /\.(mp4|webm|ogg|mov|m4v)$/i.test(name) ? 'video' : 'image';
}

function showLocal(url, type, title){
  var box = $('preview');
  if(!box) return;
  box.innerHTML = '';
  if(type === 'video'){
    var v=document.createElement('video');
    v.src=url; v.controls=true; v.autoplay=true; v.playsInline=true;
    box.appendChild(v);
  }else{
    var img=document.createElement('img');
    img.src=url; img.alt=title || '';
    box.appendChild(img);
  }
  if(screen2 && !screen2.closed){
    screen2.postMessage({type:'PLAY',url:url,mediaType:type,title:title||''},'*');
  }
}

function clearLocal(){
  $('preview').innerHTML='<div class="empty">No slide selected</div>';
  if(screen2 && !screen2.closed) screen2.postMessage({type:'CLEAR'},'*');
}

/* Screen 2 is built without any nested script tag. */
function openScreen2(){
  if(screen2 && !screen2.closed){ screen2.focus(); return; }

  screen2=window.open('about:blank','vaspireScreen','width=1280,height=720,left=1200,top=0');
  if(!screen2){
    alert('Screen 2 could not open. Please allow pop-ups for this website.');
    return;
  }

  var d=screen2.document;
  d.open();
  d.write('<!doctype html><html><head><title>Vaspire Projector</title></head><body style="margin:0;background:#000;width:100vw;height:100vh;overflow:hidden"><div id="wait" style="height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font:24px Arial">Vaspire Projector — Waiting</div></body></html>');
  d.close();

  setTimeout(function(){
    if(screen2 && !screen2.closed) screen2.focus();
  },100);
}

function sendToScreen2(data){
  if(screen2 && !screen2.closed){
    screen2.postMessage(data,'*');
  }
}

function loadLocalFolder(){
  var files=Array.prototype.slice.call($('folderFiles').files || []);
  localPlaylist=files.filter(function(f){
    return f.type.indexOf('image/')===0 || f.type.indexOf('video/')===0;
  });
  playlistIndex=-1;
  renderPlaylist();
}

function renderPlaylist(){
  var box=$('playlist');
  if(!localPlaylist.length){
    box.innerHTML='<div class="small">No local files loaded.</div>';
    return;
  }
  box.innerHTML=localPlaylist.map(function(f,i){
    return '<div class="item"><span class="name">'+(i+1)+'. '+escapeHtml(f.name)+'</span><button class="secondary" data-local-index="'+i+'">Play</button></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('[data-local-index]'),function(btn){
    btn.addEventListener('click',function(){
      playLocal(Number(btn.getAttribute('data-local-index')));
    });
  });
}

function playLocal(i){
  if(!localPlaylist.length) return;
  if(i<0) i=localPlaylist.length-1;
  if(i>=localPlaylist.length) i=0;
  playlistIndex=i;
  var f=localPlaylist[i];
  showLocal(URL.createObjectURL(f), f.type.indexOf('video/')===0?'video':'image', f.name);
}

function createLocalNameSlide(){
  var n=$('nameSlideName').value.trim();
  var c=$('nameSlideCompany').value.trim();
  if(!n){ alert('Enter the name.'); return; }

  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="100%" height="100%" fill="#07111f"/><text x="960" y="500" text-anchor="middle" fill="white" font-family="Arial" font-size="80" font-weight="700">'+escapeHtml(n)+'</text><text x="960" y="600" text-anchor="middle" fill="#13b8a6" font-family="Arial" font-size="42">'+escapeHtml(c)+'</text></svg>';
  var blob=new Blob([svg],{type:'image/svg+xml'});
  var url=URL.createObjectURL(blob);
  showLocal(url,'image',n);
}

function initLocal(){
  $('openScreen').addEventListener('click',openScreen2);
  $('fullscreen').addEventListener('click',function(){
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  $('clearPreview').addEventListener('click',clearLocal);
  $('stopLive').addEventListener('click',clearLocal);
  $('loadFolder').addEventListener('click',loadLocalFolder);
  $('previous').addEventListener('click',function(){
    if(localPlaylist.length) playLocal(playlistIndex-1);
  });
  $('next').addEventListener('click',function(){
    if(localPlaylist.length) playLocal(playlistIndex+1);
  });
  $('autoLoop').addEventListener('click',function(){
    autoLoop=!autoLoop;
    $('autoLoop').textContent='Auto Loop: '+(autoLoop?'ON':'OFF');
  });
  $('createNameSlide').addEventListener('click',createLocalNameSlide);
  $('folderFiles').addEventListener('change',function(){
    if($('folderFiles').files.length) loadLocalFolder();
  });
  setStatus($('appStatus'),'Local projector controls ready. Connecting to Supabase…',true);
}

/* =========================
   SUPABASE MODULE
   Loaded dynamically so local buttons work even if CDN fails.
   ========================= */
var db=null;
var realtimeChannel=null;

var SUPABASE_URL='https://zhufcryqamaubxjorjgm.supabase.co';
var SUPABASE_KEY='sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN';

function loadSupabase(){
  if(window.supabase && window.supabase.createClient){
    startSupabase();
    return;
  }
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload=function(){ startSupabase(); };
  s.onerror=function(){
    setStatus($('appStatus'),'Supabase library could not load. Local projector functions are still available.',false);
  };
  document.head.appendChild(s);
}

async function startSupabase(){
  try{
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var test=await db.from('meetings').select('id',{count:'exact',head:true});
    if(test.error) throw test.error;
    setStatus($('appStatus'),'Supabase connected. All meeting controls are ready.',true);
    bindSupabaseButtons();
    await loadMeetings();
  }catch(err){
    console.error('Supabase:',err);
    setStatus($('appStatus'),'Supabase connection/table error: '+(err.message||err)+'. Local projector functions remain active.',false);
  }
}

function bindSupabaseButtons(){
  $('createMeeting').addEventListener('click',createMeeting);
  $('copyLink').addEventListener('click',copyGuestLink);
  $('toggleUploads').addEventListener('click',toggleGuestUploads);
  $('uploadOperatorMedia').addEventListener('click',uploadOperatorMedia);
}

async function createMeeting(){
  if(!db){alert('Supabase is not connected.');return;}
  var name=$('meetingName').value.trim();
  if(!name){alert('Enter meeting name.');return;}
  var r=await db.from('meetings').insert({
    name:name,
    meeting_date:$('meetingDate').value||null,
    guest_upload_enabled:$('guestEnabled').checked
  }).select().single();
  if(r.error){alert(r.error.message);return;}
  await selectMeeting(r.data.id);
}

async function loadMeetings(){
  var r=await db.from('meetings').select('*').order('meeting_date',{ascending:false});
  if(r.error){setStatus($('meetingStatus'),r.error.message,false);return;}
  $('meetingList').innerHTML=(r.data||[]).map(function(m){
    return '<div class="meeting '+(meeting && meeting.id===m.id?'active':'')+'" data-meeting-id="'+m.id+'"><b>'+escapeHtml(m.name)+'</b><div class="small">'+escapeHtml(m.meeting_date||'')+' · '+(m.guest_upload_enabled?'Uploads ON':'Uploads OFF')+'</div></div>';
  }).join('') || '<div class="small">No meetings.</div>';
  Array.prototype.forEach.call($('meetingList').querySelectorAll('[data-meeting-id]'),function(el){
    el.addEventListener('click',function(){selectMeeting(el.getAttribute('data-meeting-id'));});
  });
}

async function selectMeeting(id){
  var r=await db.from('meetings').select('*').eq('id',id).single();
  if(r.error){alert(r.error.message);return;}
  meeting=r.data;
  setStatus($('meetingStatus'),meeting.name+' · '+(meeting.meeting_date||'No date')+' · '+(meeting.guest_upload_enabled?'UPLOADS ENABLED':'UPLOADS DISABLED'),true);
  $('guestEnabled').checked=!!meeting.guest_upload_enabled;
  $('toggleUploads').textContent=meeting.guest_upload_enabled?'Disable Uploads':'Enable Uploads';
  makeGuestLink();
  await loadGuests();
  await loadOperatorMedia();
  subscribe();
  await loadMeetings();
}

function makeGuestLink(){
  if(!meeting){$('guestUrl').textContent='';$('qr').innerHTML='';return;}
  var base=location.href.split('?')[0].replace(/projector\\.html$/i,'guest.html');
  var url=base+'?meeting='+encodeURIComponent(meeting.id);
  $('guestUrl').textContent=url;
  $('qr').innerHTML='<div style="padding:15px;color:#111;font-weight:bold">QR</div>';
  /* Use a simple remote QR image; if blocked, the URL is still available. */
  var img=document.createElement('img');
  img.width=190;img.height=190;img.alt='Guest Upload QR';
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=190x190&data='+encodeURIComponent(url);
  $('qr').innerHTML='';
  $('qr').appendChild(img);
  $('uploadStatus').textContent=meeting.guest_upload_enabled?'Guest uploads ENABLED':'Guest uploads DISABLED';
}

async function copyGuestLink(){
  var text=$('guestUrl').textContent;
  if(!text)return alert('Select a meeting first.');
  try{await navigator.clipboard.writeText(text);alert('Guest link copied.');}
  catch(e){prompt('Copy guest link:',text);}
}

async function toggleGuestUploads(){
  if(!meeting)return alert('Select a meeting first.');
  var value=!meeting.guest_upload_enabled;
  var r=await db.from('meetings').update({guest_upload_enabled:value}).eq('id',meeting.id);
  if(r.error){alert(r.error.message);return;}
  meeting.guest_upload_enabled=value;
  makeGuestLink();
  $('toggleUploads').textContent=value?'Disable Uploads':'Enable Uploads';
  await loadMeetings();
}

async function loadGuests(){
  var r=await db.from('guests').select('*,presentations(*)').eq('meeting_id',meeting.id);
  if(r.error){$('guestList').innerHTML='<div class="small">'+escapeHtml(r.error.message)+'</div>';return;}
  var rows=(r.data||[]).sort(function(a,b){
    var am=a.member_type==='Paid Member',bm=b.member_type==='Paid Member';
    if(am!==bm)return am?-1:1;
    if(am)return (Number(a.seat_number)||999999)-(Number(b.seat_number)||999999);
    return String(a.name||'').localeCompare(String(b.name||''));
  });
  $('guestCount').textContent='('+rows.length+')';
  $('guestList').innerHTML=rows.map(function(g){
    var ps=(g.presentations||[]).sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
    var p=ps[0];
    return '<div class="guest"><b>'+(g.member_type==='Paid Member'?escapeHtml(g.seat_number):'—')+'</b><div>'+escapeHtml(g.name)+'</div><div>'+escapeHtml(g.company_name)+'</div><div class="small">'+escapeHtml(g.member_type)+'</div><div class="small">'+(p?escapeHtml(p.file_name):'No slide')+'</div><div class="actions">'+(p?'<button class="secondary" data-preview-id="'+p.id+'">Preview</button><button data-play-id="'+p.id+'">▶ PLAY</button>':'')+'</div></div>';
  }).join('') || '<div class="empty" style="padding:30px">No guest slides.</div>';

  Array.prototype.forEach.call($('guestList').querySelectorAll('[data-preview-id]'),function(b){
    b.addEventListener('click',function(){previewPresentation(b.getAttribute('data-preview-id'));});
  });
  Array.prototype.forEach.call($('guestList').querySelectorAll('[data-play-id]'),function(b){
    b.addEventListener('click',function(){playPresentation(b.getAttribute('data-play-id'));});
  });
}

async function previewPresentation(id){
  var r=await db.from('presentations').select('*').eq('id',id).single();
  if(r.error){alert(r.error.message);return;}
  showLocal(r.data.file_url,mediaType(r.data.file_name),r.data.file_name);
}

async function playPresentation(id){
  var r=await db.from('presentations').update({status:'playing',played_at:new Date().toISOString()}).eq('id',id);
  if(r.error){alert(r.error.message);return;}
  var p=await db.from('presentations').select('*').eq('id',id).single();
  if(!p.error) showLocal(p.data.file_url,mediaType(p.data.file_name),p.data.file_name);
  await loadGuests();
}

async function loadOperatorMedia(){
  var r=await db.from('meeting_media').select('*').eq('meeting_id',meeting.id).order('sort_order').order('created_at');
  if(r.error){$('operatorMedia').innerHTML='<div class="small">'+escapeHtml(r.error.message)+'</div>';return;}
  mediaRows=r.data||[];
  renderOperatorMedia();
}

function renderOperatorMedia(){
  $('operatorMedia').innerHTML=mediaRows.map(function(m){
    return '<div class="item"><span class="name">'+escapeHtml(m.file_name)+'</span><span class="small">'+escapeHtml(m.media_type)+'</span><button class="secondary" data-media-preview="'+m.id+'">Preview</button><button data-media-play="'+m.id+'">Play</button><button class="danger" data-media-delete="'+m.id+'">×</button></div>';
  }).join('') || '<div class="small">No operator media for this meeting.</div>';

  Array.prototype.forEach.call($('operatorMedia').querySelectorAll('[data-media-preview]'),function(b){
    b.addEventListener('click',function(){
      var m=mediaRows.find(function(x){return x.id===b.getAttribute('data-media-preview');});
      if(m)showLocal(m.file_url,m.media_type,m.file_name);
    });
  });
  Array.prototype.forEach.call($('operatorMedia').querySelectorAll('[data-media-play]'),function(b){
    b.addEventListener('click',function(){
      var m=mediaRows.find(function(x){return x.id===b.getAttribute('data-media-play');});
      if(m)showLocal(m.file_url,m.media_type,m.file_name);
    });
  });
  Array.prototype.forEach.call($('operatorMedia').querySelectorAll('[data-media-delete]'),function(b){
    b.addEventListener('click',async function(){
      var id=b.getAttribute('data-media-delete');
      if(confirm('Delete this operator media?')){
        var r=await db.from('meeting_media').delete().eq('id',id);
        if(r.error)alert(r.error.message);else loadOperatorMedia();
      }
    });
  });
}

async function uploadOperatorMedia(){
  if(!meeting)return alert('Select a meeting first.');
  var files=Array.prototype.slice.call($('operatorFiles').files||[]);
  if(!files.length)return alert('Choose image/video files first.');

  for(var i=0;i<files.length;i++){
    var f=files[i];
    var safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var path=meeting.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+safe;
    var up=await db.storage.from('meeting-media').upload(path,f);
    if(up.error){alert('Upload failed for '+f.name+': '+up.error.message);continue;}
    var pub=db.storage.from('meeting-media').getPublicUrl(path).data.publicUrl;
    var ins=await db.from('meeting_media').insert({
      meeting_id:meeting.id,file_name:f.name,file_url:pub,
      media_type:f.type.indexOf('video/')===0?'video':'image',
      sort_order:mediaRows.length+i
    });
    if(ins.error)alert(ins.error.message);
  }
  $('operatorFiles').value='';
  await loadOperatorMedia();
}

function subscribe(){
  if(realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel=db.channel('meeting-'+meeting.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'presentations',filter:'meeting_id=eq.'+meeting.id},function(payload){
      if(payload.new.status==='playing'){
        showLocal(payload.new.file_url,mediaType(payload.new.file_name),payload.new.file_name);
      }
      loadGuests();
    }).subscribe();
}

/* Start local controls FIRST. */
initLocal();

/* Then load Supabase independently. */
loadSupabase();

})();
</script>
</body>
</html>
