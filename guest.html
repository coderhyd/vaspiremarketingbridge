<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Vaspire Guest Slide Upload</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07111f;
      color: #fff;
      font: 15px Arial, Helvetica, sans-serif;
      padding: 24px 14px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 26px;
      background: #0d1b2a;
      border: 1px solid #244056;
      border-radius: 16px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .brand span { color: #13b8a6; }

    .subtitle {
      color: #91a7bb;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .f {
      margin: 15px 0;
    }

    .f label {
      display: block;
      color: #a8bdd0;
      font-size: 13px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .required { color: #13b8a6; }

    .f input,
    .f select {
      width: 100%;
      padding: 13px;
      background: #071522;
      border: 1px solid #244056;
      border-radius: 9px;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .f input:focus,
    .f select:focus {
      border-color: #13b8a6;
    }

    .f input[type="file"] {
      padding: 10px;
    }

    .seat {
      display: none;
    }

    .seat.visible {
      display: block;
    }

    .hint {
      color: #718ba1;
      font-size: 12px;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #13b8a6;
      color: #03100e;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      padding: 12px;
      background: #071522;
      border-radius: 9px;
      margin-top: 13px;
      color: #91a7bb;
      line-height: 1.45;
      word-break: break-word;
    }

    .success {
      color: #57e0c8;
    }

    .error {
      color: #ff8b8b;
    }

    .closed {
      display: none;
    }

    .meeting-info {
      padding: 11px 13px;
      background: #071522;
      border-radius: 9px;
      color: #91a7bb;
      margin-bottom: 18px;
      display: none;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .card { padding: 20px; }
      .brand { font-size: 23px; }
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="brand">
      Vaspire <span>Guest Slide Upload</span>
    </div>

    <div class="subtitle">
      Submit your presentation slide for the meeting.
    </div>

    <div id="meetingInfo" class="meeting-info"></div>

    <div id="closed" class="status closed"></div>

    <form id="guestForm" novalidate>

      <div class="f">
        <label for="n">
          Name <span class="required">*</span>
        </label>
        <input
          id="n"
          type="text"
          autocomplete="name"
          maxlength="120"
          required
        >
      </div>

      <div class="f">
        <label for="c">
          Company Name <span class="required">*</span>
        </label>
        <input
          id="c"
          type="text"
          autocomplete="organization"
          maxlength="160"
          required
        >
      </div>

      <div class="f">
        <label for="t">
          Member Type <span class="required">*</span>
        </label>

        <select id="t" required>
          <option value="Paid Member">Paid Member</option>
          <option value="Visitor">Visitor</option>
        </select>
      </div>

      <!-- Seat number appears ONLY for Paid Members -->
      <div class="f seat" id="sb">
        <label for="s">
          Seat Number <span class="required">*</span>
        </label>

        <input
          id="s"
          type="text"
          inputmode="numeric"
          pattern="[0-9]+"
          maxlength="10"
          placeholder="Enter seat number"
        >

        <div class="hint">
          Seat number is required for Paid Members only.
        </div>
      </div>

      <div class="f">
        <label for="f">
          Slide <span class="required">*</span>
        </label>

        <input
          id="f"
          type="file"
          accept="image/jpeg,image/png,image/webp,application/pdf"
          required
        >

        <div class="hint">
          Accepted: JPG, PNG, WEBP or PDF.
        </div>
      </div>

      <button id="u" type="submit">
        ⬆ Upload My Slide
      </button>

      <div id="st" class="status">
        Ready.
      </div>

    </form>
  </div>

<script>
"use strict";

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://zhufcryqamaubxjorjgm.supabase.co";
const SUPABASE_KEY = "sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const meetingId =
  new URLSearchParams(window.location.search).get("meeting");
let meetingSeatRequired = true;

/* =========================================================
   DOM HELPERS
   ========================================================= */

const $ = id => document.getElementById(id);

const form = $("guestForm");
const nameInput = $("n");
const companyInput = $("c");
const typeInput = $("t");
const seatBox = $("sb");
const seatInput = $("s");
const fileInput = $("f");
const uploadButton = $("u");
const statusBox = $("st");
const closedBox = $("closed");
const meetingInfo = $("meetingInfo");

/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = "status" + (type ? " " + type : "");
}

function showClosed(message) {
  form.style.display = "none";
  closedBox.style.display = "block";
  closedBox.className = "status error";
  closedBox.textContent = message;
}

/* =========================================================
   MEMBER TYPE / SEAT NUMBER
   ========================================================= */

function updateSeatField() {
  const paid = typeInput.value === "Paid Member";
  const showSeat = paid && meetingSeatRequired;

  if (showSeat) {
    seatBox.classList.add("visible");
    seatInput.required = true;
  } else {
    seatBox.classList.remove("visible");
    seatInput.required = false;
    seatInput.value = "";
  }
}

typeInput.addEventListener("change", updateSeatField);

updateSeatField();

/* =========================================================
   VALIDATION
   ========================================================= */

function validateForm() {
  const name = nameInput.value.trim();
  const company = companyInput.value.trim();
  const memberType = typeInput.value;
  const seat = seatInput.value.trim();
  const file = fileInput.files[0];

  if (!name) {
    alert("Please enter your name.");
    nameInput.focus();
    return false;
  }

  if (!company) {
    alert("Please enter your company name.");
    companyInput.focus();
    return false;
  }

  if (memberType === "Paid Member" && meetingSeatRequired) {
    if (!seat) {
      alert("Seat Number is required for Paid Members.");
      seatInput.focus();
      return false;
    }

    if (!/^[0-9]+$/.test(seat)) {
      alert("Seat Number must contain numbers only.");
      seatInput.focus();
      return false;
    }

    const seatNumber = Number(seat);

    if (!Number.isInteger(seatNumber) || seatNumber < 1) {
      alert("Please enter a valid Seat Number.");
      seatInput.focus();
      return false;
    }
  }

  if (!file) {
    alert("Please select your slide.");
    fileInput.focus();
    return false;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "application/pdf"
  ];

  if (!allowedTypes.includes(file.type)) {
    alert("Only JPG, PNG, WEBP or PDF files are allowed.");
    return false;
  }

  return true;
}

/* =========================================================
   SAFE FILE NAME
   ========================================================= */

function safeFileName(name) {
  const extMatch = name.match(/\.([a-zA-Z0-9]+)$/);
  const ext = extMatch ? "." + extMatch[1].toLowerCase() : "";

  const base = name
    .replace(/\.[^/.]+$/, "")
    .replace(/[^a-zA-Z0-9_-]/g, "_")
    .replace(/_+/g, "_")
    .slice(0, 100);

  return (base || "slide") + ext;
}

/* =========================================================
   CHECK MEETING
   ========================================================= */

async function init() {
  if (!meetingId) {
    showClosed("Invalid meeting link.");
    return;
  }

  try {
    const result = await db
      .from("meetings")
      .select("id,title,meeting_date,guest_upload_enabled,seat_required")
      .eq("id", meetingId)
      .single();

    if (result.error) {
      console.error(result.error);
      showClosed("Invalid meeting or meeting not found.");
      return;
    }

    if (!result.data) {
      showClosed("Meeting not found.");
      return;
    }

    if (!result.data.guest_upload_enabled) {
      showClosed("Guest uploads are currently closed.");
      return;
    }

    meetingSeatRequired = result.data.seat_required !== false;
    updateSeatField();

    const title = result.data.title || "Meeting";

    meetingInfo.style.display = "block";

    if (result.data.meeting_date) {
      meetingInfo.textContent =
        title + " • " + result.data.meeting_date;
    } else {
      meetingInfo.textContent = title;
    }

  } catch (error) {
    console.error(error);
    showClosed("Unable to connect to the meeting service.");
  }
}

/* =========================================================
   UPLOAD
   ========================================================= */

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!validateForm()) return;

  uploadButton.disabled = true;
  setStatus("Uploading your slide...");

  const name = nameInput.value.trim();
  const company = companyInput.value.trim();
  const memberType = typeInput.value;
  const seat =
    memberType === "Paid Member"
      ? Number(seatInput.value.trim())
      : null;

  const file = fileInput.files[0];

  let guestId = null;
  let storagePath = null;

  try {

    /* -------------------------------------------------------
       RE-CHECK MEETING BEFORE UPLOAD
       ------------------------------------------------------- */

    const meetingCheck = await db
      .from("meetings")
      .select("id,guest_upload_enabled,seat_required")
      .eq("id", meetingId)
      .single();

    if (meetingCheck.error || !meetingCheck.data) {
      throw new Error("Meeting not found.");
    }

    if (!meetingCheck.data.guest_upload_enabled) {
      throw new Error("Guest uploads have been disabled.");
    }

    meetingSeatRequired = meetingCheck.data.seat_required !== false;
    updateSeatField();

    const finalSeat =
      memberType === "Paid Member" && meetingSeatRequired
        ? Number(seatInput.value.trim())
        : null;

    /* -------------------------------------------------------
       CREATE GUEST RECORD
       ------------------------------------------------------- */

    const guestInsert = await db
      .from("guests")
      .insert({
        meeting_id: meetingId,
        name: name,
        company_name: company,
        member_type: memberType,
        seat_number: finalSeat
      })
      .select("id")
      .single();

    if (guestInsert.error) {
      console.error("Guest insert error:", guestInsert.error);
      throw new Error(guestInsert.error.message);
    }

    guestId = guestInsert.data.id;

    /* -------------------------------------------------------
       UPLOAD FILE
       ------------------------------------------------------- */

    const filename =
      Date.now() +
      "-" +
      crypto.randomUUID() +
      "-" +
      safeFileName(file.name);

    storagePath =
      meetingId +
      "/" +
      guestId +
      "/" +
      filename;

    const upload = await db
      .storage
      .from("guest-slides")
      .upload(storagePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || "application/octet-stream"
      });

    if (upload.error) {
      console.error("Storage upload error:", upload.error);
      throw new Error(upload.error.message);
    }

    /* -------------------------------------------------------
       PUBLIC URL
       ------------------------------------------------------- */

    const publicUrlResult = db
      .storage
      .from("guest-slides")
      .getPublicUrl(storagePath);

    const fileUrl = publicUrlResult.data.publicUrl;

    /* -------------------------------------------------------
       PRESENTATION RECORD
       ------------------------------------------------------- */

    const presentation = await db
      .from("presentations")
      .insert({
        meeting_id: meetingId,
        guest_id: guestId,
        file_name: file.name,
        file_url: fileUrl,
        status: "uploaded"
      });

    if (presentation.error) {
      console.error(
        "Presentation insert error:",
        presentation.error
      );

      /*
       * Remove the uploaded file if the presentation record
       * could not be created.
       */
      await db
        .storage
        .from("guest-slides")
        .remove([storagePath]);

      throw new Error(presentation.error.message);
    }

    /* -------------------------------------------------------
       SUCCESS
       ------------------------------------------------------- */

    setStatus(
      "✓ Uploaded successfully. The operator will review and play your slide.",
      "success"
    );

    uploadButton.textContent = "✓ Slide Uploaded";
    uploadButton.disabled = true;

    nameInput.disabled = true;
    companyInput.disabled = true;
    typeInput.disabled = true;
    seatInput.disabled = true;
    fileInput.disabled = true;

  } catch (error) {
    console.error("Upload failed:", error);

    setStatus(
      "Upload failed: " +
      (error.message || "Unknown error"),
      "error"
    );

    uploadButton.disabled = false;
  }
});

/* =========================================================
   START
   ========================================================= */

init();
</script>

</body>
</html>
