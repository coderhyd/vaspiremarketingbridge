<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vaspire Guest Slide Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#06111f;
  color:#fff;
}

body{
  padding:45px 16px 60px;
}

.container{
  width:100%;
  max-width:1180px;
  margin:auto;
}

.card{
  background:#0b1a2a;
  border:1px solid #21445e;
  border-radius:28px;
  padding:55px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

h1{
  margin:0 0 14px;
  font-size:clamp(42px,6vw,72px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:-2px;
}

.white{
  color:#fff;
}

.teal{
  color:#16c3b7;
}

.subtitle{
  margin:0 0 40px;
  color:#9db5cb;
  font-size:24px;
}

.meeting-box{
  background:#061522;
  border-radius:18px;
  padding:22px 26px;
  margin-bottom:35px;
  color:#a7c1d7;
  font-size:23px;
}

.form-group{
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:12px;
  color:#a9bfd3;
  font-size:24px;
  font-weight:700;
}

.required{
  color:#16c3b7;
}

input[type="text"],
input[type="number"],
select{
  width:100%;
  height:72px;
  border:1px solid #29506b;
  border-radius:17px;
  background:#e8f0fc;
  color:#111;
  font-size:24px;
  padding:0 24px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#16c3b7;
  box-shadow:0 0 0 3px rgba(22,195,183,.15);
}

select{
  background:#071522;
  color:#fff;
}

input[type="file"]{
  width:100%;
  padding:18px;
  border:1px solid #29506b;
  border-radius:17px;
  background:#071522;
  color:#fff;
  font-size:20px;
}

.help{
  color:#7fa0ba;
  margin-top:10px;
  font-size:17px;
}

.seat-box{
  display:none;
}

.seat-box.visible{
  display:block;
}

.seat-info{
  margin-top:9px;
  color:#8ba9c0;
  font-size:16px;
}

button{
  width:100%;
  height:90px;
  border:none;
  border-radius:18px;
  background:#16c3b7;
  color:#001313;
  font-size:27px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  filter:brightness(1.05);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:25px;
  padding:22px 24px;
  border-radius:17px;
  font-size:20px;
  line-height:1.5;
  display:none;
}

.message.error{
  display:block;
  background:#241116;
  border:1px solid #71353c;
  color:#ff807d;
}

.message.success{
  display:block;
  background:#09241f;
  border:1px solid #176b58;
  color:#61e4b7;
}

.loading{
  padding:25px;
  background:#061522;
  border-radius:17px;
  color:#9eb6ca;
  font-size:20px;
}

.hidden{
  display:none!important;
}

.debug{
  margin-top:20px;
  padding:15px;
  background:#061522;
  border-radius:12px;
  color:#718da5;
  font-size:13px;
  word-break:break-all;
}

.success-box{
  text-align:center;
  padding:35px 20px;
  background:#09241f;
  border-radius:18px;
  margin-top:25px;
}

.success-box h2{
  color:#61e4b7;
  margin-top:0;
}

@media(max-width:700px){

  body{
    padding:15px 10px;
  }

  .card{
    padding:30px 20px;
  }

  h1{
    font-size:44px;
  }

  .subtitle{
    font-size:18px;
  }

  label{
    font-size:20px;
  }

  input[type="text"],
  input[type="number"],
  select{
    height:62px;
    font-size:20px;
  }

  button{
    height:75px;
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>
<span class="white">Vaspire </span>
<span class="teal">Guest Slide Upload</span>
</h1>

<p class="subtitle">
Submit your presentation slide for the meeting.
</p>

<!-- ALWAYS VISIBLE STATUS -->
<div id="statusBox" class="message"></div>

<!-- LOADING -->
<div id="loading" class="loading">
Loading meeting details...
</div>

<!-- MAIN FORM -->
<div id="mainForm" class="hidden">

<div id="meetingInfo" class="meeting-box"></div>

<!-- NAME -->
<div class="form-group">

<label>
Name <span class="required">*</span>
</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required
>

</div>

<!-- COMPANY -->
<div class="form-group">

<label>
Company Name <span class="required">*</span>
</label>

<input
type="text"
id="company"
placeholder="Enter company name"
required
>

</div>

<!-- MEMBER TYPE -->
<div class="form-group">

<label>
Member Type <span class="required">*</span>
</label>

<select id="memberType">

<option value="Visitor">
Visitor
</option>

<option value="Paid Member">
Paid Member
</option>

</select>

</div>

<!-- SEAT -->
<div
class="form-group seat-box"
id="seatBox"
>

<label>
Seat Number <span class="required">*</span>
</label>

<input
type="number"
id="seatNumber"
min="1"
step="1"
placeholder="Enter seat number"
>

<div class="seat-info">
Seat number is required for Paid Members for this meeting.
</div>

</div>

<!-- FILE -->
<div class="form-group">

<label>
Slide <span class="required">*</span>
</label>

<input
type="file"
id="slide"
accept=".jpg,.jpeg,.png,.webp,.pdf"
>

<div class="help">
Accepted: JPG, PNG, WEBP or PDF.
Maximum size: 20 MB.
</div>

</div>

<button
id="uploadBtn"
onclick="uploadSlide()"
>
↑ Upload My Slide
</button>

<div id="message" class="message"></div>

</div>

<div
id="debugBox"
class="debug"
>
Meeting URL parameter:
<span id="meetingIdDisplay"></span>
</div>

</div>
</div>


<script>

/* ============================================================
SUPABASE
============================================================ */

const SUPABASE_URL =
"https://zhufcryqamaubxjorjgm.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* ============================================================
URL
============================================================ */

const params =
new URLSearchParams(
window.location.search
);

const meetingId =
params.get("meeting");


/* ============================================================
ELEMENTS
============================================================ */

const loading =
document.getElementById("loading");

const mainForm =
document.getElementById("mainForm");

const statusBox =
document.getElementById("statusBox");

const meetingInfo =
document.getElementById("meetingInfo");

const memberType =
document.getElementById("memberType");

const seatBox =
document.getElementById("seatBox");

const seatNumber =
document.getElementById("seatNumber");

const uploadBtn =
document.getElementById("uploadBtn");

const message =
document.getElementById("message");

const meetingIdDisplay =
document.getElementById("meetingIdDisplay");

meetingIdDisplay.textContent =
meetingId || "MISSING";


/* ============================================================
STATUS
============================================================ */

function showStatus(text){

statusBox.textContent = text;

statusBox.className =
"message error";

}

function clearStatus(){

statusBox.textContent = "";

statusBox.className =
"message";

}


/* ============================================================
MESSAGE
============================================================ */

function showMessage(text,type){

message.textContent = text;

message.className =
"message " + type;

}


/* ============================================================
DATE
============================================================ */

function formatDate(value){

if(!value){
return "";
}

const date =
new Date(value + "T00:00:00");

return date.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


/* ============================================================
SEAT VISIBILITY
============================================================ */

function updateSeat(){

if(
window.currentMeeting &&
window.currentMeeting.seat_required === true &&
memberType.value === "Paid Member"
){

seatBox.classList.add("visible");

seatNumber.required = true;

}else{

seatBox.classList.remove("visible");

seatNumber.required = false;

seatNumber.value = "";

}

}


/* ============================================================
MEMBER TYPE
============================================================ */

memberType.addEventListener(
"change",
updateSeat
);


/* ============================================================
LOAD MEETING
============================================================ */

async function loadMeeting(){

clearStatus();

console.log(
"Meeting ID:",
meetingId
);


/* ------------------------------------------------------------
CHECK URL
------------------------------------------------------------ */

if(!meetingId){

loading.classList.add("hidden");

showStatus(
"Meeting ID is missing from the URL."
);

return;

}


/* ------------------------------------------------------------
QUERY
------------------------------------------------------------ */

try{

const {
data,
error
} = await supabaseClient
.from("meetings")
.select(`
id,
code,
title,
active,
meeting_date,
guest_upload_enabled,
seat_required
`)
.eq("id",meetingId)
.maybeSingle();


/* ------------------------------------------------------------
ERROR
------------------------------------------------------------ */

if(error){

console.error(
"Supabase meeting error:",
error
);

throw new Error(
error.message
);

}


/* ------------------------------------------------------------
NOT FOUND
------------------------------------------------------------ */

if(!data){

throw new Error(
"Meeting was not found. Check the meeting ID or the RLS policy on the meetings table."
);

}


/* ------------------------------------------------------------
SAVE
------------------------------------------------------------ */

window.currentMeeting =
data;

console.log(
"Meeting loaded:",
data
);


/* ------------------------------------------------------------
CHECK ACTIVE
------------------------------------------------------------ */

if(data.active === false){

throw new Error(
"This meeting is not active."
);

}


/* ------------------------------------------------------------
CHECK UPLOAD
------------------------------------------------------------ */

if(
data.guest_upload_enabled === false
){

throw new Error(
"Guest slide upload is disabled for this meeting."
);

}


/* ------------------------------------------------------------
MEETING DISPLAY
------------------------------------------------------------ */

let title =
data.title ||
"Guest Presentation";

let date =
formatDate(
data.meeting_date
);

if(date){

meetingInfo.textContent =
title + " • " + date;

}else{

meetingInfo.textContent =
title;

}


/* ------------------------------------------------------------
SHOW FORM
------------------------------------------------------------ */

loading.classList.add("hidden");

mainForm.classList.remove("hidden");

updateSeat();

console.log(
"Guest upload form ready."
);

}


/* ------------------------------------------------------------
CATCH
------------------------------------------------------------ */

catch(error){

console.error(
"LOAD ERROR:",
error
);

loading.classList.add("hidden");

mainForm.classList.add("hidden");

showStatus(
"Unable to load meeting: " +
(error.message || error)
);

}

}


/* ============================================================
UPLOAD
============================================================ */

async function uploadSlide(){

message.className =
"message";

message.textContent =
"";


/* ------------------------------------------------------------
VALUES
------------------------------------------------------------ */

const name =
document
.getElementById("name")
.value
.trim();

const company =
document
.getElementById("company")
.value
.trim();

const type =
memberType.value;

const file =
document
.getElementById("slide")
.files[0];


/* ------------------------------------------------------------
VALIDATE NAME
------------------------------------------------------------ */

if(!name){

showMessage(
"Please enter your name.",
"error"
);

return;

}


/* ------------------------------------------------------------
VALIDATE COMPANY
------------------------------------------------------------ */

if(!company){

showMessage(
"Please enter your company name.",
"error"
);

return;

}


/* ------------------------------------------------------------
VALIDATE FILE
------------------------------------------------------------ */

if(!file){

showMessage(
"Please select your presentation slide.",
"error"
);

return;

}


/* ------------------------------------------------------------
FILE TYPE
------------------------------------------------------------ */

const allowed = [

"image/jpeg",
"image/png",
"image/webp",
"application/pdf"

];

if(!allowed.includes(file.type)){

showMessage(
"Only JPG, PNG, WEBP or PDF files are accepted.",
"error"
);

return;

}


/* ------------------------------------------------------------
FILE SIZE
------------------------------------------------------------ */

if(file.size > 20 * 1024 * 1024){

showMessage(
"File is too large. Maximum size is 20 MB.",
"error"
);

return;

}


/* ------------------------------------------------------------
SEAT
------------------------------------------------------------ */

let seat = null;

if(
window.currentMeeting.seat_required === true &&
type === "Paid Member"
){

const value =
seatNumber.value.trim();

if(!value){

showMessage(
"Please enter your seat number.",
"error"
);

return;

}

seat =
parseInt(value,10);

if(
!Number.isInteger(seat) ||
seat < 1
){

showMessage(
"Please enter a valid seat number.",
"error"
);

return;

}

}


/* ------------------------------------------------------------
BUTTON
------------------------------------------------------------ */

uploadBtn.disabled = true;

uploadBtn.textContent =
"Uploading...";


try{


/* ============================================================
FILE PATH
============================================================ */

const extension =
file.name
.split(".")
.pop()
.toLowerCase();

const safeName =
name
.replace(
/[^a-zA-Z0-9]/g,
"_"
)
.substring(0,40);

const unique =
crypto.randomUUID();

const path =
window.currentMeeting.id +
"/" +
Date.now() +
"_" +
safeName +
"_" +
unique +
"." +
extension;


/* ============================================================
STORAGE
============================================================ */

const {
error: storageError
} =
await supabaseClient
.storage
.from("guest-slides")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(storageError){

throw new Error(
"Storage upload failed: " +
storageError.message
);

}


/* ============================================================
PUBLIC URL
============================================================ */

const {
data:publicData
} =
supabaseClient
.storage
.from("guest-slides")
.getPublicUrl(path);

const slideUrl =
publicData.publicUrl;


/* ============================================================
DATABASE
============================================================ */

const record = {

meeting_id:
window.currentMeeting.id,

name:
name,

company:
company,

slide_path:
path,

slide_url:
slideUrl,

status:
"ready",

member_type:
type,

seat_number:
seat,

slide_name:
file.name

};


console.log(
"INSERTING:",
record
);


const {
data,
error
} =
await supabaseClient
.from("guests")
.insert(record)
.select()
.single();


/* ============================================================
INSERT ERROR
============================================================ */

if(error){

/*
Remove uploaded file if DB insert fails.
*/

await supabaseClient
.storage
.from("guest-slides")
.remove([path]);

throw new Error(
error.message
);

}


/* ============================================================
SUCCESS
============================================================ */

console.log(
"Guest inserted:",
data
);

showMessage(
"✓ Your slide has been uploaded successfully.",
"success"
);

uploadBtn.disabled = true;

uploadBtn.textContent =
"✓ Slide Uploaded";


/* ============================================================
CLEAR
============================================================ */

document
.getElementById("name")
.value = "";

document
.getElementById("company")
.value = "";

document
.getElementById("slide")
.value = "";

seatNumber.value = "";


}
catch(error){

console.error(
"UPLOAD ERROR:",
error
);

showMessage(
"Upload failed: " +
(error.message || error),
"error"
);

uploadBtn.disabled = false;

uploadBtn.textContent =
"↑ Upload My Slide";

}

}


/* ============================================================
START
============================================================ */

loadMeeting();

</script>

</body>
</html>
