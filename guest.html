<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaspire Guest Upload</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#fff;font:15px Arial}.card{max-width:520px;margin:30px auto;padding:22px;background:#0d1b2a;border:1px solid #244056;border-radius:14px}.brand{font-size:24px;font-weight:800}.brand span{color:#13b8a6}.f{margin:12px 0}.f label{display:block;color:#91a7bb;font-size:12px;margin-bottom:5px}.f input,.f select{width:100%;padding:12px;box-sizing:border-box;background:#071522;border:1px solid #244056;border-radius:8px;color:#fff}button{width:100%;padding:13px;border:0;border-radius:8px;background:#13b8a6;font-weight:800;margin-top:9px}.status{padding:10px;background:#071522;border-radius:8px;margin-top:12px;color:#91a7bb}.seat{display:none}</style></head><body><div class=card><div class=brand>Vaspire <span>Guest Slide Upload</span></div><div id=closed class=status style="display:none"></div><div id=form><div class=f><label>Name *</label><input id=n></div><div class=f><label>Company Name *</label><input id=c></div><div class=f><label>Member Type *</label><select id=t><option>Paid Member</option><option>Visitor</option></select></div><div class="f seat" id=sb><label>Seat Number *</label><input id=s inputmode=numeric></div><div class=f><label>Slide *</label><input id=f type=file accept="image/jpeg,image/png,image/webp,application/pdf"></div><button id=u>⬆ Upload My Slide</button><div id=st class=status>Ready.</div></div></div><script>const db=supabase.createClient('https://zhufcryqamaubxjorjgm.supabase.co','sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN'),mid=new URLSearchParams(location.search).get('meeting'),$=x=>document.getElementById(x);$('t').onchange=()=>{$('sb').style.display=$('t').value==='Paid Member'?'block':'none'};async function init(){let r=await db.from('meetings').select('*').eq('id',mid).single();if(r.error||!r.data||!r.data.guest_upload_enabled){$('form').style.display='none';$('closed').style.display='block';$('closed').textContent=r.error?'Invalid meeting.':'Guest uploads are currently closed.'}}$('u').onclick=async()=>{let n=$('n').value.trim(),c=$('c').value.trim(),t=$('t').value,s=$('s').value.trim(),f=$('f').files[0];if(!n||!c||!f||(t==='Paid Member'&&!s))return alert('Complete all required fields.');$('u').disabled=true;$('st').textContent='Uploading...';let g=await db.from('guests').insert({meeting_id:mid,name:n,company_name:c,member_type:t,seat_number:t==='Paid Member'?Number(s):null}).select().single();if(g.error){$('st').textContent=g.error.message;$('u').disabled=false;return}let path=mid+'/'+g.data.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await db.storage.from('guest-slides').upload(path,f);if(up.error){$('st').textContent=up.error.message;$('u').disabled=false;return}let url=db.storage.from('guest-slides').getPublicUrl(path).data.publicUrl,p=await db.from('presentations').insert({meeting_id:mid,guest_id:g.data.id,file_name:f.name,file_url:url,status:'uploaded'});if(p.error){$('st').textContent=p.error.message;$('u').disabled=false;return}$('st').textContent='✓ Uploaded successfully. The operator will review and play your slide.';$('u').disabled=true};init();</script></body></html>
