<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaspire Guest Presentation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f5fa;--card:#fff;--ink:#19151f;--muted:#6f6978;--brand:#5b18c9;--line:#e5deed;--good:#0b8f68;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f5fa,#eee8f7);font-family:Inter,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:620px;margin:auto;padding:24px}.logo{font-weight:900;color:var(--brand);font-size:23px}.logo span{font-size:10px;color:#777;letter-spacing:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 14px 40px #2d185018}h1{margin:0 0 8px;font-size:28px}.muted{color:var(--muted);font-size:13px;line-height:1.65}
label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}input[type=text],input[type=tel],input[type=file]{width:100%;padding:12px;border:1px solid #dcd5e5;border-radius:10px;font-size:15px;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:900;font-size:15px;margin-top:14px;cursor:pointer}button.secondary{background:#24212a}button.end{background:#444}button:disabled{opacity:.45;cursor:not-allowed}
.preview{margin-top:18px;border:1px solid #e6e0eb;border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden;padding:10px;color:#777;text-align:center}.preview img{max-width:100%;max-height:360px;object-fit:contain}
.status{margin-top:13px;padding:11px 12px;border-radius:9px;background:#f4f0f8;color:var(--brand);font-size:13px;font-weight:800;line-height:1.45}.status.good{color:var(--good);background:#ecfaf5}.status.error{color:var(--danger);background:#fff0ee}.meeting{font-size:11px;color:#777;margin-top:10px;word-break:break-all}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Vaspire <span>MARKETING BRIDGE</span></div>
  <div class="card">
    <h1>Your Presentation</h1>
    <div class="muted">Upload your slide for this meeting. When you are ready to speak, press <b>PLAY MY SLIDE</b>. The projector will change automatically.</div>

    <form id="form">
      <label for="name">Name</label><input id="name" type="text" required placeholder="Your name">
      <label for="company">Company</label><input id="company" type="text" placeholder="Company / organisation">
      <label for="file">Slide</label><input id="file" type="file" accept="image/*" required>
      <div class="preview" id="preview">Select your slide</div>
      <button id="uploadBtn" type="submit">Upload My Slide</button>
    </form>

    <div id="playArea" class="hidden">
      <div class="status" id="status">Slide uploaded and ready.</div>
      <button id="play">▶ PLAY MY SLIDE</button>
      <button id="end" class="end">⏹ END PRESENTATION</button>
    </div>

    <div class="meeting" id="meetingInfo"></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://zhufcryqamaubxjorjgm.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const meetingId=new URLSearchParams(location.search).get('meeting');
const form=document.getElementById('form');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const playArea=document.getElementById('playArea');
const statusBox=document.getElementById('status');
const meetingInfo=document.getElementById('meetingInfo');
const uploadBtn=document.getElementById('uploadBtn');
let selectedFile=null;
let guestId=null;
let presentationId=null;

function status(text,type=''){statusBox.textContent=text;statusBox.className='status '+type}
function safeName(name){return name.replace(/[^a-zA-Z0-9._-]+/g,'_').slice(0,120)}

async function verifyMeeting(){
  if(!meetingId){status('Invalid guest link: meeting ID is missing.','error');uploadBtn.disabled=true;return false}
  const {data,error}=await sb.from('meetings').select('id,title,active,code').eq('id',meetingId).maybeSingle();
  if(error){status('Could not connect to the meeting database: '+error.message,'error');uploadBtn.disabled=true;return false}
  if(!data || data.active===false){status('This meeting is not active. Please scan the current meeting QR code.','error');uploadBtn.disabled=true;return false}
  meetingInfo.textContent='Meeting: '+(data.title||data.code||meetingId);
  return true;
}

fileInput.addEventListener('change',()=>{
  selectedFile=fileInput.files[0]||null;
  if(!selectedFile){preview.textContent='Select your slide';return}
  if(!selectedFile.type.startsWith('image/')){status('Please choose a slide image (JPG, PNG or WebP).','error');fileInput.value='';selectedFile=null;return}
  if(selectedFile.size>10*1024*1024){status('Please keep the slide below 10 MB.','error');fileInput.value='';selectedFile=null;return}
  const url=URL.createObjectURL(selectedFile);
  preview.innerHTML='<img src="'+url+'" alt="Slide preview">';
  status('Slide selected. Upload it when ready.');
});

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  if(!selectedFile)return status('Please select a slide first.','error');
  uploadBtn.disabled=true;
  status('Uploading your slide…');
  try{
    const name=document.getElementById('name').value.trim()||'Guest';
    const company=document.getElementById('company').value.trim();
    guestId=crypto.randomUUID();

    const guestInsert=await sb.from('guests').insert({id:guestId,meeting_id:meetingId,name,company}).select().single();
    if(guestInsert.error)throw guestInsert.error;

    const path=meetingId+'/'+guestId+'-'+Date.now()+'-'+safeName(selectedFile.name);
    const upload=await sb.storage.from('guest-slides').upload(path,selectedFile,{contentType:selectedFile.type,upsert:false});
    if(upload.error)throw upload.error;

    const publicUrl=sb.storage.from('guest-slides').getPublicUrl(path).data.publicUrl;
    const presentationInsert=await sb.from('presentations').insert({
      id:crypto.randomUUID(),meeting_id:meetingId,guest_id:guestId,
      file_name:selectedFile.name,file_url:publicUrl,status:'uploaded'
    }).select().single();
    if(presentationInsert.error)throw presentationInsert.error;
    presentationId=presentationInsert.data.id;

    form.classList.add('hidden');
    playArea.classList.remove('hidden');
    status('Slide uploaded and ready. Press PLAY MY SLIDE when you begin speaking.','good');
  }catch(error){
    console.error(error);
    status('Upload failed: '+error.message,'error');
    uploadBtn.disabled=false;
  }
});

document.getElementById('play').addEventListener('click',async()=>{
  if(!presentationId)return;
  status('Sending your slide to the projector…');
  const endOthers=await sb.from('presentations').update({status:'ended'}).eq('meeting_id',meetingId).eq('status','playing');
  if(endOthers.error){status('Could not start presentation: '+endOthers.error.message,'error');return}
  const {error}=await sb.from('presentations').update({status:'playing',played_at:new Date().toISOString()}).eq('id',presentationId);
  if(error){status('Could not start presentation: '+error.message,'error');return}
  status('▶ Your slide is LIVE on the projector.','good');
});

document.getElementById('end').addEventListener('click',async()=>{
  if(!presentationId)return;
  const {error}=await sb.from('presentations').update({status:'ended'}).eq('id',presentationId);
  if(error){status('Could not end presentation: '+error.message,'error');return}
  status('Your presentation has ended.','good');
});

verifyMeeting();
</script>
</body></html>
