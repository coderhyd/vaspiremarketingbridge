<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaspire Guest Slide Control</title>
<style>
:root{--bg:#06101c;--panel:#0d1b2a;--panel2:#102235;--line:#29455c;--text:#eef6fb;--muted:#91a7bb;--accent:#13b8a6;--danger:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#06101c,#0c1d2c);color:var(--text);font:14px Arial,sans-serif}
.wrap{max-width:1300px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:800}.brand span{color:var(--accent)}
.status{padding:10px 12px;border-radius:8px;background:#071522;color:var(--muted);margin:12px 0}
.ok{color:#61e4ca}.bad{color:#ff9a96}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:15px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#071522;color:#fff}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:15px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.name{font-size:18px;font-weight:800}.company{color:var(--muted);margin-top:4px}
.meta{font-size:12px;color:var(--muted);margin:10px 0}
.file{font-size:12px;word-break:break-all;color:#9debe0}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:#031511;font-weight:800;cursor:pointer}
button.secondary{background:#213a50;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:40px}
.preview{height:220px;background:#000;border-radius:8px;margin:10px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{max-width:100%;max-height:100%;object-fit:contain}
.now{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{padding:5px 8px;border-radius:20px;background:#123d3b;color:#61e4ca;font-size:11px;font-weight:800}
@media(max-width:700px){.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Vaspire <span>Guest Slide Control</span></div>
    <button id="refresh" class="secondary">Refresh</button>
  </div>

  <div id="status" class="status">Connecting to active meeting…</div>

  <section class="panel">
    <div class="now">
      <div>
        <div class="small">ACTIVE MEETING</div>
        <h2 id="meetingTitle" style="margin:5px 0">Loading…</h2>
      </div>
      <div id="playingBadge"></div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search guest name, company, seat or presentation…">
      <button id="clearSearch" class="secondary">Clear</button>
    </div>
    <div id="count" class="status">Loading presentations…</div>
    <div id="guestList" class="grid"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

var SUPABASE_URL='https://zhufcryqamaubxjorjgm.supabase.co';
var SUPABASE_KEY='sb_publishable_X19Y-4uYxO9HPosfbIg2yQ_tMf07glN';
var db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var activeMeeting=null;
var rows=[];
var channel=null;

function $(id){return document.getElementById(id);}

function escapeHtml(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
  });
}

function mediaType(name){
  return /\.(mp4|webm|ogg|mov|m4v)$/i.test(name||'')?'video':'image';
}

function setStatus(text,good){
  $('status').textContent=text;
  $('status').className='status '+(good===true?'ok':good===false?'bad':'');
}

async function loadActiveMeeting(){
  var r=await db.from('meetings')
    .select('*')
    .eq('active',true)
    .maybeSingle();

  if(r.error){
    activeMeeting=null;
    rows=[];
    $('meetingTitle').textContent='Unable to load active meeting';
    setStatus(r.error.message,false);
    render();
    return;
  }

  activeMeeting=r.data||null;

  if(!activeMeeting){
    rows=[];
    $('meetingTitle').textContent='No Active Meeting';
    $('playingBadge').innerHTML='';
    setStatus('There is currently no active meeting.',false);
    render();
    subscribe();
    return;
  }

  $('meetingTitle').textContent=activeMeeting.title||'Active Meeting';
  setStatus('Active meeting loaded. Loading guest presentations…',true);

  await loadPresentations();
  subscribe();
}

async function loadPresentations(){
  if(!activeMeeting)return;

  var r=await db.from('guests')
    .select('*,presentations(*)')
    .eq('meeting_id',activeMeeting.id);

  if(r.error){
    rows=[];
    setStatus('Could not load guest presentations: '+r.error.message,false);
    render();
    return;
  }

  rows=(r.data||[]).map(function(g){
    var ps=(g.presentations||[]).sort(function(a,b){
      return new Date(b.created_at)-new Date(a.created_at);
    });
    return {guest:g,presentation:ps[0]||null};
  }).filter(function(x){return !!x.presentation;});

  setStatus(rows.length+' guest presentation(s) available.',true);
  render();
}

function render(){
  var q=($('search').value||'').trim().toLowerCase();

  var filtered=rows.filter(function(x){
    var g=x.guest,p=x.presentation;
    return !q || [
      g.name,g.company_name,g.member_type,g.seat_number,
      p.file_name,p.status
    ].join(' ').toLowerCase().indexOf(q)!==-1;
  });

  $('count').textContent=filtered.length+' presentation(s) shown'+(q?' · '+rows.length+' total':'');

  if(!filtered.length){
    $('guestList').innerHTML='<div class="empty">No guest presentations found.</div>';
    return;
  }

  $('guestList').innerHTML=filtered.map(function(x){
    var g=x.guest,p=x.presentation;
    var playing=p.status==='playing';

    return '<div class="card '+(playing?'playing':'')+'">'
      +'<div class="now">'
      +'<div class="name">'+escapeHtml(g.name)+'</div>'
      +(playing?'<span class="badge">● PLAYING</span>':'')
      +'</div>'
      +'<div class="company">'+escapeHtml(g.company_name||'')+'</div>'
      +'<div class="meta">'
      +(g.member_type==='Paid Member'?'Seat '+escapeHtml(g.seat_number||'—')+' · ':'')
      +escapeHtml(g.member_type||'')
      +'</div>'
      +'<div class="file">'+escapeHtml(p.file_name)+'</div>'
      +'<div class="preview" id="preview-'+escapeHtml(p.id)+'"><span style="color:#60778b">Preview</span></div>'
      +'<button '+(playing?'disabled':'')+' data-play="'+escapeHtml(p.id)+'">'
      +(playing?'▶ PLAYING':'▶ PLAY EVERYWHERE')+'</button>'
      +'</div>';
  }).join('');

  filtered.forEach(function(x){
    var p=x.presentation;
    var box=$('preview-'+p.id);
    if(!box)return;

    if(mediaType(p.file_name)==='video'){
      box.innerHTML='<video src="'+escapeHtml(p.file_url)+'" controls muted preload="metadata"></video>';
    }else{
      box.innerHTML='<img src="'+escapeHtml(p.file_url)+'" alt="'+escapeHtml(p.file_name)+'">';
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-play]'),function(btn){
    btn.addEventListener('click',function(){
      playEverywhere(btn.getAttribute('data-play'));
    });
  });

  var playing=rows.find(function(x){return x.presentation.status==='playing';});
  $('playingBadge').innerHTML=playing
    ?'<span class="badge">NOW PLAYING: '+escapeHtml(playing.guest.name)+'</span>'
    :'';
}

async function playEverywhere(id){
  if(!activeMeeting)return;

  var p=rows.map(function(x){return x.presentation;}).find(function(x){return x.id===id;});
  if(!p)return;

  var stop=await db.from('presentations')
    .update({status:'ready'})
    .eq('meeting_id',activeMeeting.id)
    .eq('status','playing');

  if(stop.error){
    alert('Could not stop current presentation: '+stop.error.message);
    return;
  }

  var play=await db.from('presentations')
    .update({
      status:'playing',
      played_at:new Date().toISOString()
    })
    .eq('id',id);

  if(play.error){
    alert('Could not play presentation: '+play.error.message);
    return;
  }

  await loadPresentations();
}

function subscribe(){
  if(channel){
    db.removeChannel(channel);
    channel=null;
  }

  if(!activeMeeting)return;

  channel=db.channel('guest-slide-control-'+activeMeeting.id)
    .on('postgres_changes',{
      event:'*',
      schema:'public',
      table:'presentations',
      filter:'meeting_id=eq.'+activeMeeting.id
    },function(){
      loadPresentations();
    })
    .subscribe();
}

$('search').addEventListener('input',render);
$('clearSearch').addEventListener('click',function(){
  $('search').value='';
  render();
});
$('refresh').addEventListener('click',loadActiveMeeting);

loadActiveMeeting();

})();
</script>
</body>
</html>
